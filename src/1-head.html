<title>Budget</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one mobile-first column (max 820px) — sticky month header, scrolling envelopes, fixed bottom tab bar, bottom sheets for every edit */
:root{
  --bg:#F1F3F8; --surface:#FFFFFF; --surface-2:#E7EBF3; --fg:#131A2C; --muted:#535C70; --line:#DCE1EC;
  --accent:#1E3A8A; --accent-ink:#FFFFFF; --accent-soft:#DDE5F8; --accent-strong:#1E3A8A;
  --good:#17663F; --good-soft:#D6F0E1; --hero:#1E3A8A; --hero-ink:#FFFFFF; --side-bg:#16214A; --side-fg:#EEF2FF; --side-muted:#A9B4D6; --side-on:#2B3B78;
  --warn:#8F5300; --warn-soft:#FCEACB; --bad:#B42318; --bad-soft:#FBDFDA; --zero-soft:#E4E8F0;
  --info:#1E3A8A; --info-soft:#E1E8FA; --scrim:rgba(8,14,32,.45); --shadow:0 10px 30px rgba(12,22,52,.16);
  --f-display:'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', sans-serif;
  --f-body:'Manrope', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --r-s:10px; --r-m:16px; --r-l:22px;
  --flag-red:#D64545; --flag-orange:#E07B22; --flag-yellow:#D4A514; --flag-green:#2E9A5E; --flag-blue:#3B6FD8; --flag-purple:#8A55D0;
  --c1:#1E3A8A; --c2:#17824F; --c3:#C26A1B; --c4:#7C4DC4; --c5:#B8336A; --c6:#2A8C9B; --c7:#7A8B2E; --c8:#6B7280;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A1122; --surface:#111A30; --surface-2:#1A2440; --fg:#E7ECF7; --muted:#9AA6BF; --line:#25304D;
  --accent:#86A8FF; --accent-ink:#081128; --accent-soft:#1C2A52; --accent-strong:#B3C8FF;
  --good:#6FD3A0; --good-soft:#123528; --hero:#2A4AA8; --hero-ink:#FFFFFF; --side-bg:#0D1530; --side-fg:#E7ECF7; --side-muted:#8E9AB8; --side-on:#1F2B57;
  --warn:#F2B35C; --warn-soft:#3A2B12; --bad:#F48C7E; --bad-soft:#3F1E1A; --zero-soft:#1F2945;
  --info:#9DB6FF; --info-soft:#1A2750; --scrim:rgba(0,0,0,.6); --shadow:0 10px 30px rgba(0,0,0,.55);
  --c1:#86A8FF; --c2:#6FD3A0; --c3:#F0A050; --c4:#B894F0; --c5:#F07AA8; --c6:#5CC4D2; --c7:#B8C960; --c8:#A0A8B3;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0A1122; --surface:#111A30; --surface-2:#1A2440; --fg:#E7ECF7; --muted:#9AA6BF; --line:#25304D;
  --accent:#86A8FF; --accent-ink:#081128; --accent-soft:#1C2A52; --accent-strong:#B3C8FF;
  --good:#6FD3A0; --good-soft:#123528; --hero:#2A4AA8; --hero-ink:#FFFFFF; --side-bg:#0D1530; --side-fg:#E7ECF7; --side-muted:#8E9AB8; --side-on:#1F2B57;
  --warn:#F2B35C; --warn-soft:#3A2B12; --bad:#F48C7E; --bad-soft:#3F1E1A; --zero-soft:#1F2945;
  --info:#9DB6FF; --info-soft:#1A2750; --scrim:rgba(0,0,0,.6); --shadow:0 10px 30px rgba(0,0,0,.55);
  --c1:#86A8FF; --c2:#6FD3A0; --c3:#F0A050; --c4:#B894F0; --c5:#F07AA8; --c6:#5CC4D2; --c7:#B8C960; --c8:#A0A8B3;
  color-scheme:dark }
html,body{height:100%}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.4; -webkit-tap-highlight-color:transparent}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display); text-wrap:balance; margin:0}
#app{max-width:820px; margin:0 auto; min-height:100%; padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.side,.insp{display:none}
.toolbar{display:flex; gap:4px; flex-wrap:wrap; padding-block:6px 2px}
@media (max-width:700px){ .toolbar{flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch} .toolbar::-webkit-scrollbar{display:none} .toolbar > *{flex:none} }
.tbtn{height:36px; padding:0 10px; border:none; background:transparent; border-radius:10px; color:var(--accent); font-weight:700; font-size:13.5px; display:inline-flex; align-items:center; gap:6px}
.tbtn svg{width:17px; height:17px}
.viewsw{display:inline-flex; background:var(--surface-2); border-radius:10px; padding:2px; gap:2px}
.viewsw button{width:34px; height:30px; border:none; border-radius:8px; background:transparent; color:var(--muted); display:flex; align-items:center; justify-content:center}
.viewsw button.on{background:var(--surface); color:var(--fg); box-shadow:0 1px 2px rgba(0,0,0,.15)}
.viewsw svg{width:17px; height:17px}
.compact .cat .bar{display:none} .compact .cat{min-height:40px; padding-block:4px} .compact .ass-in{height:30px} .compact .pill{height:26px}
.tbtn:hover{background:var(--surface-2)} .tbtn.on{background:var(--accent-soft)} .tbtn:disabled{opacity:.4; cursor:default}
.balbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); padding:10px 14px; margin-top:4px}
.balbar > div{display:flex; flex-direction:column} .balbar small{font-size:11px; color:var(--muted); font-weight:700} .balbar .num{font-weight:700; font-size:15px} .balbar .strong{font-size:17px; font-weight:800} .balbar .op{color:var(--muted); font-weight:800}
.chev{display:inline-flex} .chev svg{width:16px; height:16px; transition:transform .15s} .chev.shut svg{transform:rotate(-90deg)}
@media (min-width:1024px){
  #app{max-width:none; padding-bottom:0; height:100%}
  .shell{display:grid; grid-template-columns:270px minmax(0,1fr); height:100vh; height:100dvh}
  .shell.with-insp{grid-template-columns:270px minmax(0,1fr) 340px}
  .side{display:flex; flex-direction:column; background:var(--side-bg); color:var(--side-fg); overflow-y:auto; padding:12px 10px; gap:4px}
  .main{overflow-y:auto; min-width:0; padding-bottom:40px}
  .insp{display:block; overflow-y:auto; border-left:1px solid var(--line); padding:16px; background:var(--bg)}
  .wrap{padding-left:28px; padding-right:28px}
  .top{position:sticky; top:0}
  .side-plan{display:flex; gap:10px; align-items:center; width:100%; border:none; background:transparent; color:inherit; text-align:left; padding:8px; border-radius:12px}
  .side-plan:hover{background:rgba(255,255,255,.07)}
  .side-plan .logo{width:36px; height:36px; border-radius:10px; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; flex:none}
  .side .muted, .side .small{color:var(--side-muted)}
  .side-nav{display:flex; flex-direction:column; gap:2px; margin:8px 0 10px}
  .snav{display:flex; align-items:center; gap:12px; height:44px; padding:0 12px; border:none; border-radius:10px; background:transparent; color:inherit; font-weight:700; font-size:15px; text-align:left}
  .snav svg{width:20px; height:20px} .snav:hover{background:rgba(255,255,255,.07)} .snav.on{background:var(--side-on)}
  .side-sec{margin-top:6px}
  .side-sec-h{display:flex; align-items:center; gap:6px; width:100%; border:none; background:transparent; color:var(--side-muted); font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:8px 10px; text-align:left}
  .side-sec-h .num{letter-spacing:0; font-size:13px; color:var(--side-fg)}
  .side-acct{display:flex; align-items:center; gap:8px; width:100%; border:none; background:transparent; color:inherit; padding:8px 10px 8px 32px; border-radius:9px; font-size:14px; font-weight:600; text-align:left}
  .side-acct .linked{display:inline-flex; color:var(--good); opacity:.9} .side-acct .linked svg{width:13px; height:13px}
  .amt-warn{color:var(--warn)}
  .side-after{display:flex; gap:8px; padding:0 10px 6px 32px; margin-top:-4px; font-size:12.5px; opacity:.65} .side-after .num{font-size:12.5px}
  .side-acct:hover{background:rgba(255,255,255,.07)} .side-acct.dragging{opacity:.4} .side-acct.drop-over{box-shadow:inset 0 2px 0 var(--accent)} .side-acct.on{background:var(--side-on)} .side-acct .num{font-size:13.5px}
  .side .amt-bad{color:#F7A99E}
  .side-foot{margin-top:auto; padding-top:14px; display:flex; flex-direction:column; gap:8px}
  .side-foot .btn{background:rgba(255,255,255,.08); color:var(--side-fg); border-color:transparent}
  .dhead{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px; padding-block:14px 6px; position:sticky; top:0; background:var(--bg); z-index:5}
  .dmonth{font-size:26px} .ibtn.round{border:2px solid var(--accent); border-radius:999px; width:40px; height:40px; color:var(--accent)}
  .mnote{border:none; background:transparent; color:var(--muted); font-size:14px; padding:0; width:220px} .mnote:focus{outline:none; color:var(--fg)}
  .rta.d{margin:0; min-width:340px; padding:12px 16px}
  .rta.d .amt{font-size:28px}
  .stats{display:none}
  .colhead{position:sticky; top:84px; background:var(--bg); z-index:4; padding:10px 14px 6px}
  .group{border-radius:14px}
  .cat{min-height:52px; padding:8px 14px}
  .cat .ctop{flex-direction:row; align-items:baseline; justify-content:space-between; gap:12px}
  .cat .cname .note{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .w-ass{width:120px} .w-act{width:120px} .w-av{width:130px} .ass-in{width:120px}
  .hide-s{display:block}
  .hint-box{background:var(--surface-2); border-radius:12px; padding:10px 12px; margin-top:10px; font-size:13px; color:var(--muted); text-align:center}
  .ipanel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); padding:16px; margin-bottom:14px}
  .ipanel h3{font-size:16px; display:flex; align-items:center; gap:8px; margin-bottom:10px} .ipanel h3 svg{width:18px; height:18px}
  .irow{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:5px 0; font-size:14px} .irow span, .irow label{color:var(--muted); font-weight:600}
  .irow.big{border-top:1px solid var(--line); margin-top:6px; padding-top:10px; font-size:15px} .irow.big span{color:var(--fg); font-weight:800}
  .mini{width:110px; height:34px; border:1px solid var(--line); border-radius:9px; background:var(--surface-2); text-align:right; padding:0 8px; font-weight:700}
  .aa{display:flex; justify-content:space-between; width:100%; border:none; background:var(--accent-soft); color:var(--accent-strong); border-radius:10px; padding:10px 12px; margin-bottom:6px; font-weight:700; font-size:14px}
  .aa:hover{filter:brightness(.97)} .aa:disabled{opacity:.45; cursor:default}
  .rtable-wrap{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); overflow-x:auto; margin-top:8px}
  .rtable{width:100%; border-collapse:collapse; font-size:14px}
  .rtable th{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); text-align:left; padding:10px; position:sticky; top:0; background:var(--surface); border-bottom:1px solid var(--line)}
  .rtable td{padding:7px 10px; border-top:1px solid var(--line); white-space:nowrap}
  .rtable .r{text-align:right} .rtable tr.unapproved td{background:color-mix(in srgb, var(--info-soft) 60%, transparent)}
  .rtable .todo{color:var(--warn); font-weight:800}
  .cellbtn{border:none; background:none; padding:0; font-weight:700; text-align:left; color:inherit}
  .cellbtn:hover{text-decoration:underline}
  .toast{bottom:24px}
  .actionbar{bottom:24px}
}
.wrap{padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex; align-items:center; gap:10px}
.between{justify-content:space-between}
.grow{flex:1; min-width:0}
.ellip{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* header */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); padding-block:10px 8px}
.top-bar{display:flex; align-items:center; gap:6px}
.top-title{flex:1; min-width:0; text-align:center}
.top-title h1{font-size:21px; line-height:1.15}
.top-title .sub{font-size:12px; color:var(--muted); font-weight:600}
button > svg, label > svg, a > svg, .li > svg{width:20px; height:20px; flex:none}
.li > svg{color:var(--muted)}
.ibtn{width:44px; height:44px; border:none; background:transparent; border-radius:12px; display:inline-flex; align-items:center; justify-content:center; color:var(--fg); flex:none}
.ibtn:hover{background:var(--surface-2)}
.ibtn:disabled{opacity:.35; cursor:default}
.ibtn svg{width:21px; height:21px}

/* ready to assign */
.rta{margin-top:8px; border-radius:var(--r-l); padding:14px 16px; display:flex; align-items:center; gap:12px; border:none; width:100%; text-align:left}
.rta.pos{background:var(--hero); color:var(--hero-ink)}
.rta.zero{background:var(--surface); color:var(--fg); border:1px solid var(--line)}
.rta.neg{background:var(--bad); color:#fff}
.rta .lbl{font-size:13px; font-weight:700; opacity:.92}
.rta .amt{font-family:var(--f-display); font-weight:700; font-size:30px; line-height:1.05}
.rta .cta{margin-left:auto; display:inline-flex; align-items:center; height:44px; padding:0 16px; border-radius:999px; border:none; background:var(--hero-ink); color:var(--hero); font-weight:800; font-size:14px; flex:none}
.rta.neg .cta{color:var(--bad)}
.rta.zero .cta{background:var(--accent-soft); color:var(--accent-strong)}
.stats{display:flex; gap:8px; margin-top:10px; overflow-x:auto; scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stat{flex:none; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); padding:8px 12px; min-width:0; text-align:left}
.stat b{display:block; font-size:15px}
.stat span{font-size:11.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.05em}
.chips{display:flex; gap:6px; overflow-x:auto; padding-block:10px 4px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; height:36px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-weight:700; font-size:13px; color:var(--muted); display:inline-flex; align-items:center; gap:6px}
.chip.on{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.chip svg{width:16px; height:16px}

/* plan list */
.colhead{display:flex; justify-content:flex-end; gap:8px; padding:8px 4px 4px; font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.colhead .c-name{margin-right:auto}
.w-ass{width:78px; text-align:right; flex:none}
.w-act{width:84px; text-align:right; flex:none}
.w-av{width:90px; text-align:right; flex:none}
.hide-s{display:none}
@media (min-width:640px){ .hide-s{display:block} }
.group{background:var(--surface); border-radius:var(--r-l); margin-top:10px; overflow:hidden; border:1px solid var(--line)}
.ghead{display:flex; align-items:center; gap:8px; padding:6px 12px 6px 6px; min-height:48px; background:var(--surface)}
.gadd{width:26px; height:26px; border-radius:999px; border:none; background:var(--accent); color:var(--accent-ink); display:inline-flex; align-items:center; justify-content:center; flex:none; opacity:.85}
.gadd svg{width:15px; height:15px}
.ghead .gname{font-family:var(--f-display); font-weight:600; font-size:15.5px; flex:0 1 auto; min-width:0; text-align:left; border:none; background:none; display:flex; align-items:center; gap:4px; padding:6px}
.ghead .gname svg{width:18px; height:18px; transition:transform .15s}
.ghead.collapsed .gname svg{transform:rotate(-90deg)}
.ghead .gsum{font-size:12.5px; color:var(--muted); font-weight:700}
.cat{display:flex; align-items:center; gap:8px; padding:10px 12px; border-top:1px solid var(--line); min-height:56px}
.cat .cname{flex:1; min-width:0; border:none; background:none; text-align:left; padding:0; display:flex; flex-direction:column; gap:5px}
.cat .cname .t{font-weight:700; font-size:15px; line-height:1.25; overflow-wrap:anywhere}
.cat .cname .note{font-size:12px; color:var(--muted); font-weight:600}
.ctop{display:flex; flex-direction:column; gap:3px; min-width:0}
.act{font-weight:700; font-size:13.5px}
.cat.sel{background:var(--accent-soft)}
.ass-in{width:78px; height:36px; border:1px solid transparent; background:var(--surface-2); border-radius:9px; text-align:right; padding:0 8px; font-weight:700; font-size:14px; font-variant-numeric:tabular-nums}
.ass-in:focus{border-color:var(--accent); background:var(--surface); outline:none}
.pill{display:inline-flex; justify-content:flex-end; align-items:center; min-width:0; max-width:90px; height:30px; padding:0 9px; border-radius:999px; font-weight:800; font-size:13.5px; border:none; font-variant-numeric:tabular-nums; white-space:nowrap}
.pill.good{background:var(--good-soft); color:var(--good)}
.pill.zero{background:var(--zero-soft); color:var(--muted)}
.pill.warn{background:var(--warn-soft); color:var(--warn)}
.pill.bad{background:var(--bad-soft); color:var(--bad)}
.pill.credit{background:var(--warn-soft); color:var(--warn); outline:2px dashed var(--warn); outline-offset:-2px}
.bar{height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden; width:100%}
.bar > i{display:block; height:100%; border-radius:999px; background:var(--good)}
.bar.warn > i{background:var(--warn)}
.bar.bad > i{background:var(--bad)}
.editrow{display:flex; gap:4px; flex:none}
.editrow .ibtn{width:36px; height:36px}
.editrow .ibtn svg{width:18px; height:18px}
.addline{display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line)}

/* banners */
.banner{display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:var(--r-m); margin-top:10px; font-weight:700; font-size:13.5px}
.banner.warn{background:var(--warn-soft); color:var(--warn)}
.banner.bad{background:var(--bad-soft); color:var(--bad)}
.banner.info{background:var(--info-soft); color:var(--info)}
.banner{flex-wrap:wrap} .banner > span{flex:1 1 170px; min-width:0} .banner .btn{margin-left:auto; flex:none} .banner .bbtns{display:flex; gap:8px; margin-left:auto; flex:none} .banner .bbtns .btn{margin-left:0} .banner > span.bbtns{flex:none}
.banner > svg{width:20px; height:20px; flex:none}

/* buttons & fields */
.btn{height:44px; padding:0 16px; border-radius:12px; border:1px solid var(--line); background:var(--surface); font-weight:800; font-size:14px; display:inline-flex; align-items:center; justify-content:center; gap:8px; white-space:nowrap}
.btn svg{width:18px; height:18px}
.btn.pri{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.danger{color:var(--bad); border-color:var(--bad-soft); background:var(--bad-soft)}
.btn.ghost{background:transparent; border-color:transparent}
.btn.sm{height:36px; padding:0 12px; font-size:13px; border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45; cursor:default}
.field{display:flex; flex-direction:column; gap:6px}
.field > label, .lbl2{font-size:12px; font-weight:800; color:var(--muted); letter-spacing:.04em; text-transform:uppercase}
.in, select.in, textarea.in{height:46px; border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:0 12px; width:100%; font-size:16px; min-width:0}
textarea.in{height:auto; min-height:70px; padding:10px 12px; resize:vertical}
.in:focus{outline:none; border-color:var(--accent)}
.grid2{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px}
.seg{display:flex; background:var(--surface-2); border-radius:12px; padding:3px; gap:3px}
.seg button{flex:1; height:40px; border:none; border-radius:9px; background:transparent; font-weight:800; font-size:13.5px; color:var(--muted)}
