<title>Mon budget</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one mobile-first column (max 820px) — sticky month header, scrolling envelopes, fixed bottom tab bar, bottom sheets for every edit */
:root{
  --bg:#F1F3F8; --surface:#FFFFFF; --surface-2:#E7EBF3; --fg:#131A2C; --muted:#535C70; --line:#DCE1EC;
  --accent:#1E3A8A; --accent-ink:#FFFFFF; --accent-soft:#DDE5F8; --accent-strong:#1E3A8A;
  --good:#17663F; --good-soft:#D6F0E1; --hero:#1E3A8A; --hero-ink:#FFFFFF;
  --warn:#8F5300; --warn-soft:#FCEACB; --bad:#B42318; --bad-soft:#FBDFDA; --zero-soft:#E4E8F0;
  --info:#1E3A8A; --info-soft:#E1E8FA; --scrim:rgba(8,14,32,.45); --shadow:0 10px 30px rgba(12,22,52,.16);
  --f-display:'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', sans-serif;
  --f-body:'Manrope', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --r-s:10px; --r-m:16px; --r-l:22px;
  --flag-red:#D64545; --flag-orange:#E07B22; --flag-yellow:#D4A514; --flag-green:#2E9A5E; --flag-blue:#3B6FD8; --flag-purple:#8A55D0;
  --c1:#1E3A8A; --c2:#17824F; --c3:#C26A1B; --c4:#7C4DC4; --c5:#B8336A; --c6:#2A8C9B; --c7:#7A8B2E; --c8:#6B7280;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A1122; --surface:#111A30; --surface-2:#1A2440; --fg:#E7ECF7; --muted:#9AA6BF; --line:#25304D;
  --accent:#86A8FF; --accent-ink:#081128; --accent-soft:#1C2A52; --accent-strong:#B3C8FF;
  --good:#6FD3A0; --good-soft:#123528; --hero:#2A4AA8; --hero-ink:#FFFFFF;
  --warn:#F2B35C; --warn-soft:#3A2B12; --bad:#F48C7E; --bad-soft:#3F1E1A; --zero-soft:#1F2945;
  --info:#9DB6FF; --info-soft:#1A2750; --scrim:rgba(0,0,0,.6); --shadow:0 10px 30px rgba(0,0,0,.55);
  --c1:#86A8FF; --c2:#6FD3A0; --c3:#F0A050; --c4:#B894F0; --c5:#F07AA8; --c6:#5CC4D2; --c7:#B8C960; --c8:#A0A8B3;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0A1122; --surface:#111A30; --surface-2:#1A2440; --fg:#E7ECF7; --muted:#9AA6BF; --line:#25304D;
  --accent:#86A8FF; --accent-ink:#081128; --accent-soft:#1C2A52; --accent-strong:#B3C8FF;
  --good:#6FD3A0; --good-soft:#123528; --hero:#2A4AA8; --hero-ink:#FFFFFF;
  --warn:#F2B35C; --warn-soft:#3A2B12; --bad:#F48C7E; --bad-soft:#3F1E1A; --zero-soft:#1F2945;
  --info:#9DB6FF; --info-soft:#1A2750; --scrim:rgba(0,0,0,.6); --shadow:0 10px 30px rgba(0,0,0,.55);
  --c1:#86A8FF; --c2:#6FD3A0; --c3:#F0A050; --c4:#B894F0; --c5:#F07AA8; --c6:#5CC4D2; --c7:#B8C960; --c8:#A0A8B3;
  color-scheme:dark }
html,body{height:100%}
body{background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.4; -webkit-tap-highlight-color:transparent}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display); text-wrap:balance; margin:0}
#app{max-width:820px; margin:0 auto; min-height:100%; padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex; align-items:center; gap:10px}
.between{justify-content:space-between}
.grow{flex:1; min-width:0}
.ellip{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* header */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); padding-block:10px 8px}
.top-bar{display:flex; align-items:center; gap:6px}
.top-title{flex:1; min-width:0; text-align:center}
.top-title h1{font-size:21px; line-height:1.15}
.top-title .sub{font-size:12px; color:var(--muted); font-weight:600}
button > svg, label > svg, a > svg, .li > svg{width:20px; height:20px; flex:none}
.li > svg{color:var(--muted)}
.ibtn{width:44px; height:44px; border:none; background:transparent; border-radius:12px; display:inline-flex; align-items:center; justify-content:center; color:var(--fg); flex:none}
.ibtn:hover{background:var(--surface-2)}
.ibtn:disabled{opacity:.35; cursor:default}
.ibtn svg{width:21px; height:21px}

/* ready to assign */
.rta{margin-top:8px; border-radius:var(--r-l); padding:14px 16px; display:flex; align-items:center; gap:12px; border:none; width:100%; text-align:left}
.rta.pos{background:var(--hero); color:var(--hero-ink)}
.rta.zero{background:var(--surface); color:var(--fg); border:1px solid var(--line)}
.rta.neg{background:var(--bad); color:#fff}
.rta .lbl{font-size:13px; font-weight:700; opacity:.92}
.rta .amt{font-family:var(--f-display); font-weight:700; font-size:30px; line-height:1.05}
.rta .cta{margin-left:auto; display:inline-flex; align-items:center; height:44px; padding:0 16px; border-radius:999px; border:none; background:var(--hero-ink); color:var(--hero); font-weight:800; font-size:14px; flex:none}
.rta.neg .cta{color:var(--bad)}
.rta.zero .cta{background:var(--accent-soft); color:var(--accent-strong)}
.stats{display:flex; gap:8px; margin-top:10px; overflow-x:auto; scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stat{flex:none; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); padding:8px 12px; min-width:0; text-align:left}
.stat b{display:block; font-size:15px}
.stat span{font-size:11.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.05em}
.chips{display:flex; gap:6px; overflow-x:auto; padding-block:10px 4px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; height:36px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-weight:700; font-size:13px; color:var(--muted); display:inline-flex; align-items:center; gap:6px}
.chip.on{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.chip svg{width:16px; height:16px}

/* plan list */
.colhead{display:flex; justify-content:flex-end; gap:8px; padding:8px 4px 4px; font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.colhead .c-name{margin-right:auto}
.w-ass{width:78px; text-align:right; flex:none}
.w-act{width:84px; text-align:right; flex:none}
.w-av{width:90px; text-align:right; flex:none}
.hide-s{display:none}
@media (min-width:640px){ .hide-s{display:block} }
.group{background:var(--surface); border-radius:var(--r-l); margin-top:10px; overflow:hidden; border:1px solid var(--line)}
.ghead{display:flex; align-items:center; gap:8px; padding:6px 12px 6px 6px; min-height:48px; background:var(--surface)}
.ghead .gname{font-family:var(--f-display); font-weight:600; font-size:15.5px; flex:1; min-width:0; text-align:left; border:none; background:none; display:flex; align-items:center; gap:4px; padding:6px}
.ghead .gname svg{width:18px; height:18px; transition:transform .15s}
.ghead.collapsed .gname svg{transform:rotate(-90deg)}
.ghead .gsum{font-size:12.5px; color:var(--muted); font-weight:700}
.cat{display:flex; align-items:center; gap:8px; padding:10px 12px; border-top:1px solid var(--line); min-height:56px}
.cat .cname{flex:1; min-width:0; border:none; background:none; text-align:left; padding:0; display:flex; flex-direction:column; gap:5px}
.cat .cname .t{font-weight:700; font-size:15px; line-height:1.25; overflow-wrap:anywhere}
.cat .cname .note{font-size:12px; color:var(--muted); font-weight:600}
.cat.sel{background:var(--accent-soft)}
.ass-in{width:78px; height:36px; border:1px solid transparent; background:var(--surface-2); border-radius:9px; text-align:right; padding:0 8px; font-weight:700; font-size:14px; font-variant-numeric:tabular-nums}
.ass-in:focus{border-color:var(--accent); background:var(--surface); outline:none}
.pill{display:inline-flex; justify-content:flex-end; align-items:center; min-width:0; max-width:90px; height:30px; padding:0 9px; border-radius:999px; font-weight:800; font-size:13.5px; border:none; font-variant-numeric:tabular-nums; white-space:nowrap}
.pill.good{background:var(--good-soft); color:var(--good)}
.pill.zero{background:var(--zero-soft); color:var(--muted)}
.pill.warn{background:var(--warn-soft); color:var(--warn)}
.pill.bad{background:var(--bad-soft); color:var(--bad)}
.pill.credit{background:var(--warn-soft); color:var(--warn); outline:2px dashed var(--warn); outline-offset:-2px}
.bar{height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden; width:100%}
.bar > i{display:block; height:100%; border-radius:999px; background:var(--good)}
.bar.warn > i{background:var(--warn)}
.bar.bad > i{background:var(--bad)}
.editrow{display:flex; gap:4px; flex:none}
.editrow .ibtn{width:36px; height:36px}
.editrow .ibtn svg{width:18px; height:18px}
.addline{display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line)}

/* banners */
.banner{display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:var(--r-m); margin-top:10px; font-weight:700; font-size:13.5px}
.banner.warn{background:var(--warn-soft); color:var(--warn)}
.banner.bad{background:var(--bad-soft); color:var(--bad)}
.banner.info{background:var(--info-soft); color:var(--info)}
.banner .btn{margin-left:auto; flex:none}
.banner > svg{width:20px; height:20px; flex:none}

/* buttons & fields */
.btn{height:44px; padding:0 16px; border-radius:12px; border:1px solid var(--line); background:var(--surface); font-weight:800; font-size:14px; display:inline-flex; align-items:center; justify-content:center; gap:8px; white-space:nowrap}
.btn svg{width:18px; height:18px}
.btn.pri{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.danger{color:var(--bad); border-color:var(--bad-soft); background:var(--bad-soft)}
.btn.ghost{background:transparent; border-color:transparent}
.btn.sm{height:36px; padding:0 12px; font-size:13px; border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45; cursor:default}
.field{display:flex; flex-direction:column; gap:6px}
.field > label, .lbl2{font-size:12px; font-weight:800; color:var(--muted); letter-spacing:.04em; text-transform:uppercase}
.in, select.in, textarea.in{height:46px; border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:0 12px; width:100%; font-size:16px; min-width:0}
textarea.in{height:auto; min-height:70px; padding:10px 12px; resize:vertical}
.in:focus{outline:none; border-color:var(--accent)}
.grid2{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px}
.seg{display:flex; background:var(--surface-2); border-radius:12px; padding:3px; gap:3px}
.seg button{flex:1; height:40px; border:none; border-radius:9px; background:transparent; font-weight:800; font-size:13.5px; color:var(--muted)}
.seg button.on{background:var(--surface); color:var(--fg); box-shadow:0 1px 3px rgba(0,0,0,.12)}
.switch{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:48px}
.switch input{width:22px; height:22px; accent-color:var(--accent)}

/* lists */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); overflow:hidden}
.li{display:flex; align-items:center; gap:12px; padding:12px 14px; border-top:1px solid var(--line); min-height:56px; background:none; border-left:none; border-right:none; border-bottom:none; width:100%; text-align:left}
.li:first-child{border-top:none}
button.li:hover{background:var(--surface-2)}
.li .ic{width:36px; height:36px; border-radius:11px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; flex:none; color:var(--muted)}
.li .ic svg{width:19px; height:19px}
.sec-t{font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:18px 4px 8px; display:flex; justify-content:space-between; align-items:center}
.amt-pos{color:var(--good)}
.amt-neg{color:var(--fg)}
.amt-bad{color:var(--bad)}

/* register */
.tx{display:flex; align-items:center; gap:10px; padding:10px 12px; border-top:1px solid var(--line); min-height:60px}
.tx:first-child{border-top:none}
.tx .main{flex:1; min-width:0; border:none; background:none; text-align:left; padding:0; display:flex; flex-direction:column; gap:3px}
.tx .p{font-weight:700; font-size:15px}
.tx .c{font-size:12.5px; color:var(--muted); font-weight:600}
.tx .c.todo{color:var(--warn); font-weight:800}
.tx .a{font-weight:800; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
.tx .rb{font-size:11.5px; color:var(--muted); font-weight:600; text-align:right}
.tx.unapproved{background:color-mix(in srgb, var(--info-soft) 60%, transparent)}
.clr{width:30px; height:30px; border-radius:999px; border:2px solid var(--line); background:transparent; font-size:12px; font-weight:800; color:var(--muted); flex:none; display:flex; align-items:center; justify-content:center}
.clr.c{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.clr.r{background:var(--fg); border-color:var(--fg); color:var(--bg)}
.flag{width:8px; height:28px; border-radius:4px; flex:none}
.chk{width:22px; height:22px; accent-color:var(--accent); flex:none}
.day{font-size:12px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); padding:14px 4px 6px}
.actionbar{position:fixed; left:0; right:0; bottom:calc(68px + env(safe-area-inset-bottom,0px)); z-index:25; display:flex; justify-content:center; padding-left:max(12px, env(safe-area-inset-left,0px)); padding-right:max(12px, env(safe-area-inset-right,0px))}
.actionbar > div{background:var(--fg); color:var(--bg); border-radius:18px; padding:8px; display:flex; gap:4px; align-items:center; box-shadow:var(--shadow); overflow-x:auto; max-width:100%}
.actionbar button{height:40px; padding:0 12px; border:none; border-radius:12px; background:transparent; color:var(--bg); font-weight:800; font-size:13px; white-space:nowrap}
.actionbar button:hover{background:rgba(127,127,127,.25)}

/* nav */
.nav{position:fixed; left:0; right:0; bottom:0; z-index:22; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px)}
.nav > div{max-width:820px; margin:0 auto; display:grid; grid-template-columns:repeat(5, minmax(0,1fr))}
.nav button{height:64px; min-width:0; padding:0 2px; border:none; background:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:11px; font-weight:800; color:var(--muted)}
.nav button svg{width:23px; height:23px}
.nav button.on{color:var(--accent)}
.fab{position:fixed; z-index:23; right:max(18px, calc(env(safe-area-inset-right,0px) + 18px)); bottom:calc(80px + env(safe-area-inset-bottom,0px)); width:58px; height:58px; border-radius:20px; border:none; background:var(--accent); color:var(--accent-ink); box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center}
.fab svg{width:26px; height:26px}
@media (min-width:860px){ .fab{right:calc(50% - 410px + 18px)} }

/* sheet */
.scrim{position:fixed; inset:0; background:var(--scrim); z-index:40; display:flex; align-items:flex-end; justify-content:center; animation:fade .15s ease}
.sheet{background:var(--bg); width:100%; max-width:640px; max-height:92vh; border-radius:24px 24px 0 0; display:flex; flex-direction:column; box-shadow:var(--shadow); animation:up .22s cubic-bezier(.2,.9,.3,1); padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){ .scrim{align-items:center} .sheet{border-radius:24px; max-height:86vh} }
.sheet-h{display:flex; align-items:center; gap:6px; padding:10px max(10px, env(safe-area-inset-right,0px)) 6px max(10px, env(safe-area-inset-left,0px)); border-bottom:1px solid var(--line)}
.sheet-h h2{flex:1; font-size:18px; text-align:center; min-width:0}
.sheet-b > *{flex-shrink:0}
.sheet-b{overflow-y:auto; padding-block:14px 20px; display:flex; flex-direction:column; gap:14px}
.sheet-f{padding-block:10px; border-top:1px solid var(--line); display:flex; gap:10px}
@keyframes up{from{transform:translateY(40px); opacity:.4}to{transform:none; opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){ .sheet,.scrim{animation:none} .ghead .gname svg{transition:none} }
.bigamt{font-family:var(--f-display); font-size:38px; font-weight:700; text-align:center; border:none; background:transparent; width:100%; height:58px; font-variant-numeric:tabular-nums}
.bigamt:focus{outline:none}
.bigamt.out{color:var(--fg)} .bigamt.in{color:var(--good)}
.flags{display:flex; gap:8px; flex-wrap:wrap}
.flags button{width:40px; height:40px; border-radius:12px; border:2px solid transparent}
.flags button.on{border-color:var(--fg)}
.split{display:grid; grid-template-columns:minmax(0,1fr) 110px 40px; gap:8px; align-items:center}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(150px + env(safe-area-inset-bottom,0px)); z-index:60; background:var(--fg); color:var(--bg); border-radius:14px; padding:10px 10px 10px 16px; display:flex; gap:10px; align-items:center; font-weight:700; font-size:14px; box-shadow:var(--shadow); max-width:calc(100% - 32px)}
.toast button{border:none; background:transparent; color:var(--accent-soft); font-weight:800; height:36px; padding:0 10px; border-radius:10px}

/* reflect */
.kpis{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px}
@media (min-width:640px){ .kpis{grid-template-columns:repeat(4, minmax(0,1fr))} }
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); padding:12px 14px; min-width:0}
.kpi span{font-size:11.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--muted)}
.kpi b{display:block; font-family:var(--f-display); font-size:21px; margin-top:2px}
.chartbox{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); padding:14px; overflow-x:auto}
.chartbox svg{display:block; width:100%; height:auto}
.legend{display:flex; flex-direction:column; gap:2px; margin-top:8px}
.legend .li{padding:8px 4px; min-height:44px}
.dot{width:12px; height:12px; border-radius:4px; flex:none}
.tbl{width:100%; border-collapse:collapse; font-size:13.5px; font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:9px 8px; text-align:right; border-top:1px solid var(--line); white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left; position:sticky; left:0; background:var(--surface)}
.tbl thead th{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); border-top:none}
.tbl tr.tot td{font-weight:800}

/* onboarding */
.hero{padding-block:48px 24px; display:flex; flex-direction:column; gap:16px}
.hero h1{font-size:40px; line-height:1.02}
.hero p{font-size:16px; color:var(--muted); max-width:34em; margin:0}
.steps{display:flex; flex-direction:column; gap:10px}
.stepc{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); padding:14px; display:flex; gap:12px; align-items:flex-start}
.stepc b{font-family:var(--f-display); font-size:20px; color:var(--accent); width:26px; flex:none}
.empty{padding:28px 16px; text-align:center; color:var(--muted); display:flex; flex-direction:column; gap:10px; align-items:center}
.kbd-hint{font-size:12px; color:var(--muted)}
</style>
