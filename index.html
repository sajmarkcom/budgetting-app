}

html,body{height:100%}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.4; -webkit-tap-highlight-color:transparent}

  .side-acct .linked{display:inline-flex; color:var(--good); opacity:.9} .side-acct .linked svg{width:13px; height:13px}

  .side-acct:hover{background:rgba(255,255,255,.07)} .side-acct.dragging{opacity:.4} .side-acct.drop-over{box-shadow:inset 0 2px 0 var(--accent)} .side-acct.on{background:var(--side-on)} .side-acct .num{font-size:13.5px}

  .irow{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:5px 0; font-size:14px} .irow span, .irow label{color:var(--muted); font-weight:600}
  .irow.big{border-top:1px solid var(--line); margin-top:6px; padding-top:10px; font-size:15px} .irow.big span{color:var(--fg); font-weight:800}
  .mini{width:110px; height:34px; border:1px solid var(--line); border-radius:9px; background:var(--surface-2); text-align:right; padding:0 8px; font-weight:700}

  .aa:hover{filter:brightness(.97)} .aa:disabled{opacity:.45; cursor:default}

}
.wrap{padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex; align-items:center; gap:10px}
.between{justify-content:space-between}
.grow{flex:1; min-width:0}
.ellip{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* header */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); padding-block:10px 8px}
.top-bar{display:flex; align-items:center; gap:6px}
.top-title{flex:1; min-width:0; text-align:center}
.top-title h1{font-size:21px; line-height:1.15}
.top-title .sub{font-size:12px; color:var(--muted); font-weight:600}
button > svg, label > svg, a > svg, .li > svg{width:20px; height:20px; flex:none}
.li > svg{color:var(--muted)}
.ibtn{width:44px; height:44px; border:none; background:transparent; border-radius:12px; display:inline-flex; align-items:center; justify-content:center; color:var(--fg); flex:none}
.ibtn:hover{background:var(--surface-2)}
.ibtn:disabled{opacity:.35; cursor:default}
.ibtn svg{width:21px; height:21px}

/* ready to assign */
.rta{margin-top:8px; border-radius:var(--r-l); padding:14px 16px; display:flex; align-items:center; gap:12px; border:none; width:100%; text-align:left}
.rta.pos{background:var(--hero); color:var(--hero-ink)}
.rta.zero{background:var(--surface); color:var(--fg); border:1px solid var(--line)}
.rta.neg{background:var(--bad); color:#fff}
.rta .lbl{font-size:13px; font-weight:700; opacity:.92}
.rta .amt{font-family:var(--f-display); font-weight:700; font-size:30px; line-height:1.05}
.rta .cta{margin-left:auto; display:inline-flex; align-items:center; height:44px; padding:0 16px; border-radius:999px; border:none; background:var(--hero-ink); color:var(--hero); font-weight:800; font-size:14px; flex:none}
.rta.neg .cta{color:var(--bad)}
.rta.zero .cta{background:var(--accent-soft); color:var(--accent-strong)}
.stats{display:flex; gap:8px; margin-top:10px; overflow-x:auto; scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stat{flex:none; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); padding:8px 12px; min-width:0; text-align:left}

.chip{flex:none; height:36px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-weight:700; font-size:13px; color:var(--muted); display:inline-flex; align-items:center; gap:6px}
.chip.on{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.chip svg{width:16px; height:16px}

/* plan list */
.colhead{display:flex; justify-content:flex-end; gap:8px; padding:8px 4px 4px; font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.colhead .c-name{margin-right:auto}
.w-ass{width:78px; text-align:right; flex:none}
.w-act{width:84px; text-align:right; flex:none}
.w-av{width:90px; text-align:right; flex:none}
.hide-s{display:none}
@media (min-width:640px){ .hide-s{display:block} }
.group{background:var(--surface); border-radius:var(--r-l); margin-top:10px; overflow:hidden; border:1px solid var(--line)}
.ghead{display:flex; align-items:center; gap:8px; padding:6px 12px 6px 6px; min-height:48px; background:var(--surface)}
.gadd{width:26px; height:26px; border-radius:999px; border:none; background:var(--accent); color:var(--accent-ink); display:inline-flex; align-items:center; justify-content:center; flex:none; opacity:.85}
.gadd svg{width:15px; height:15px}
.ghead .gname{font-family:var(--f-display); font-weight:600; font-size:15.5px; flex:0 1 auto; min-width:0; text-align:left; border:none; background:none; display:flex; align-items:center; gap:4px; padding:6px}

.ghead .gsum{font-size:12.5px; color:var(--muted); font-weight:700}
.cat{display:flex; align-items:center; gap:8px; padding:10px 12px; border-top:1px solid var(--line); min-height:56px}

.cat .cname .t{font-weight:700; font-size:15px; line-height:1.25; overflow-wrap:anywhere}
.cat .cname .note{font-size:12px; color:var(--muted); font-weight:600}
.ctop{display:flex; flex-direction:column; gap:3px; min-width:0}
.act{font-weight:700; font-size:13.5px}
.cat.sel{background:var(--accent-soft)}

.pill.credit{background:var(--warn-soft); color:var(--warn); outline:2px dashed var(--warn); outline-offset:-2px}
.bar{height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden; width:100%}
.bar > i{display:block; height:100%; border-radius:999px; background:var(--good)}
.bar.warn > i{background:var(--warn)}
.bar.bad > i{background:var(--bad)}
.editrow{display:flex; gap:4px; flex:none}
.editrow .ibtn{width:36px; height:36px}
.editrow .ibtn svg{width:18px; height:18px}
.addline{display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line)}

/* banners */
.banner{display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:var(--r-m); margin-top:10px; font-weight:700; font-size:13.5px}
.banner.warn{background:var(--warn-soft); color:var(--warn)}
.banner.bad{background:var(--bad-soft); color:var(--bad)}
.banner.info{background:var(--info-soft); color:var(--info)}
.banner{flex-wrap:wrap} .banner > span{flex:1 1 170px; min-width:0} .banner .btn{margin-left:auto; flex:none} .banner .bbtns{display:flex; gap:8px; margin-left:auto; flex:none} .banner .bbtns .btn{margin-left:0} .banner > span.bbtns{flex:none}
.banner > svg{width:20px; height:20px; flex:none}

.btn{height:44px; padding:0 16px; border-radius:12px; border:1px solid var(--line); background:var(--surface); font-weight:800; font-size:14px; display:inline-flex; align-items:center; justify-content:center; gap:8px; white-space:nowrap}

.btn.block{width:100%}

<div id="app"></div>
<nav id="nav" class="nav" aria-label="Main navigation"></nav>
<button id="fab" class="fab" aria-label="Add transaction" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="actionbar" class="actionbar"></div>
<script>
/* ================= Budget — core: utils, model, storage, budget engine ================= */
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayISO = () => isoOf(new Date());
const curMonth = () => todayISO().slice(0, 7);
const monthOf = iso => iso.slice(0, 7);
function addMonths(m, n) { let [y, mo] = m.split('-').map(Number); mo += n; y += Math.floor((mo - 1) / 12); mo = ((mo - 1) % 12 + 12) % 12 + 1; return y + '-' + pad(mo); }
function monthDiff(a, b) { const [ay, am] = a.split('-').map(Number), [by, bm] = b.split('-').map(Number); return (by - ay) * 12 + (bm - am); }
const MONTHS = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];
const MSHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'June', 'July', 'Aug', 'Sept', 'Oct', 'Nov', 'Dec'];
const DAYS = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function monthLabel(m, short) { const [y, mo] = m.split('-').map(Number); return short ? MSHORT[mo - 1] + ' ' + String(y).slice(2) : cap(MONTHS[mo - 1]) + ' ' + y; }
function parseISO(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(iso, n) { const d = parseISO(iso); d.setDate(d.getDate() + n); return isoOf(d); }
function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
function dayLabel(iso) {
  const t = todayISO();
  if (iso === t) return 'Today';
  if (iso === addDays(t, -1)) return 'Yesterday';
  if (iso === addDays(t, 1)) return 'Tomorrow';
  const d = parseISO(iso);
  return cap(DAYS[d.getDay()]) + ', ' + cap(MONTHS[d.getMonth()]) + ' ' + d.getDate() + (d.getFullYear() !== new Date().getFullYear() ? ', ' + d.getFullYear() : '');
}
function fmtDate(iso) {
  if (!iso) return '';
  const f = A.plan?.dateFmt || 'dmy';
  const [y, m, d] = iso.split('-');
  return f === 'ymd' ? iso : f === 'mdy' ? `${m}/${d}/${y}` : `${d}/${m}/${y}`;
}
let _nf = null, _nfKey = '';
function fmt(c, opts = {}) {
  const cur = A.plan?.currency || 'EUR';
  const key = cur + (opts.short ? 's' : '');
  if (_nfKey !== key) { _nf = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: cur, minimumFractionDigits: opts.short ? 0 : 2, maximumFractionDigits: opts.short ? 0 : 2 }); _nfKey = key; }
  const v = (c || 0) / 100;
  return _nf.format(Object.is(v, -0) ? 0 : v).replace('-', '−').replace(/\s(?=[€$£])/, '');
}
const fmtS = c => fmt(c, { short: true });
const fmtIn = c => (c / 100).toFixed(2).replace('.', ',');

/* amount expression parser: "12,50", "50+12.5", "3*20" */
function evalExpr(raw) {
  let s = String(raw ?? '').replace(/[\s€$£]/g, '').replace(/−/g, '-').replace(/[x×X]/g, '*').replace(/÷/g, '/');
  s = s.replace(/(\d)\.(\d{3})(?!\d)/g, '$1$2').replace(/,/g, '.');
  if (!s) return null;
  if (!/^[-+*/().\d]+$/.test(s)) return null;
  let i = 0;
  const num = () => { const st = i; while (i < s.length && /[\d.]/.test(s[i])) i++; const v = parseFloat(s.slice(st, i)); if (isNaN(v)) throw 0; return v; };
  const factor = () => { if (s[i] === '-') { i++; return -factor(); } if (s[i] === '+') { i++; return factor(); } if (s[i] === '(') { i++; const v = expr(); if (s[i] !== ')') throw 0; i++; return v; } return num(); };
  const term = () => { let v = factor(); while (s[i] === '*' || s[i] === '/') { const op = s[i++]; const f = factor(); v = op === '*' ? v * f : v / f; } return v; };
  const expr = () => { let v = term(); while (s[i] === '+' || s[i] === '-') { const op = s[i++]; const t = term(); v = op === '+' ? v + t : v - t; } return v; };
  try { const v = expr(); if (i !== s.length || !isFinite(v)) return null; return Math.round(v * 100); } catch (e) { return null; }
}

/* ---------- account types ---------- */
const ACCT = {
  checking: { label: 'Checking', grp: 'budget' },
  savings: { label: 'Savings', grp: 'budget' },
  cash: { label: 'Cash', grp: 'budget' },
  credit: { label: 'Credit Card', grp: 'budget', credit: true },
  loc: { label: 'Line of Credit', grp: 'budget', credit: true },
  mortgage: { label: 'Mortgage', grp: 'loan', debt: true },
  auto: { label: 'Auto Loan', grp: 'loan', debt: true },
  student: { label: 'Student Loan', grp: 'loan', debt: true },
  personal: { label: 'Personal Loan', grp: 'loan', debt: true },
  medical: { label: 'Medical Debt', grp: 'loan', debt: true },
  otherdebt: { label: 'Other Debt', grp: 'loan', debt: true },
  asset: { label: 'Asset (Tracking)', grp: 'tracking' },
  liability: { label: 'Liability (Tracking)', grp: 'tracking', debt: true },
};
const onBudget = a => !!a && ACCT[a.type]?.grp === 'budget';
const isCredit = a => !!a && !!ACCT[a.type]?.credit;
const isDebt = a => !!a && !!ACCT[a.type]?.debt;

const FREQ = {
  never: 'Never', daily: 'Daily', weekly: 'Weekly', biweekly: 'Every other week', twicemonth: 'Twice a month',
  every4w: 'Every 4 weeks', monthly: 'Monthly', bimonthly: 'Every other month', quarterly: 'Every 3 months', every4m: 'Every 4 months',
  semiannual: 'Twice a year', yearly: 'Yearly', every2y: 'Every other year'
};
function nextDate(iso, f) {
  const d = parseISO(iso);
  const addM = n => { const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); };
  switch (f) {
    case 'daily': d.setDate(d.getDate() + 1); break;
    case 'weekly': d.setDate(d.getDate() + 7); break;
    case 'biweekly': d.setDate(d.getDate() + 14); break;
    case 'every4w': d.setDate(d.getDate() + 28); break;
    case 'twicemonth': if (d.getDate() < 15) d.setDate(d.getDate() + 15); else { d.setDate(d.getDate() - 15); addM(1); } break;
    case 'monthly': addM(1); break;
    case 'bimonthly': addM(2); break;
    case 'quarterly': addM(3); break;
    case 'every4m': addM(4); break;
    case 'semiannual': addM(6); break;
    case 'yearly': addM(12); break;
    case 'every2y': addM(24); break;
    default: return null;
  }
  return isoOf(d);
}

const FLAGS = [['red', 'Red'], ['orange', 'Orange'], ['yellow', 'Yellow'], ['green', 'Green'], ['blue', 'Blue'], ['purple', 'Purple']];

/* ---------- app state ---------- */
const A = {
  index: { plans: [], current: null, updatedAt: 0 },
  plan: null,    // current plan core
  tx: [],        // current plan transactions
  view: 'plan', month: curMonth(), acct: null, // acct: id | 'all'
  ui: { filter: 'all', edit: false, collapsed: {}, showHidden: false, regFilter: 'all', search: '', select: false, selected: new Set(), reflect: 'spending', period: '3m', groupBy: 'group' },
  undo: [], redo: [],
  sync: 'local', // local | syncing | synced | error
  calcV: 0,
};

function defaultPlan(name) {
  const g = (n, cats) => ({ id: uid(), name: n, cats });
  const groups = [
    g('Bills', ['Rent', 'Utilities', 'Phone & Internet', 'Insurance', 'Subscriptions']),
    g('Needs', ['Groceries', 'Transportation', 'Dining Out', 'Health', 'Shopping']),
    g('Goals', ['Emergency Fund', 'Vacation', 'Gifts']),
    g('Fun Money', ['Hobbies', 'Stuff I Forgot to Budget For']),
  ];
  const p = {
    id: uid(), name: name || 'My Plan', currency: 'EUR', dateFmt: 'dmy', startMonth: curMonth(), createdAt: Date.now(), updatedAt: Date.now(), rev: '',
    accounts: [], groups: [{ id: 'g_cc', name: 'Credit Card Payments', sys: 'cc' }], cats: [], assigned: {}, moves: [], payees: [], rules: [], scheduled: [], notes: {},
  };
  for (const gr of groups) { p.groups.push({ id: gr.id, name: gr.name }); for (const c of gr.cats) p.cats.push({ id: uid(), gid: gr.id, name: c, note: '', target: null }); }
  return p;
}

/* ---------- lookups (rebuilt on every change) ---------- */
let L = {};
function rebuildLookups() {
  const p = A.plan; L = { acct: {}, cat: {}, group: {}, payee: {}, payeeByName: {}, ccCat: {} };
  if (!p) return;
  for (const a of p.accounts) L.acct[a.id] = a;
  for (const g of p.groups) L.group[g.id] = g;
  for (const c of p.cats) { L.cat[c.id] = c; if (c.cc) L.ccCat[c.cc] = c; }

function targetText(c, m, s) {
  const x = s.x, ti = s.ti;
  if (x.available < 0) return x.creditOver > 0 && !x.cashOver ? 'Overspent ' + fmt(x.creditOver) + ' on credit' : 'Overspent ' + fmt(-x.available);
  if (c.cc) { const bal = -(balances()[c.cc]?.working || 0); return bal > x.available ? fmt(bal - x.available) + ' more needed to pay balance' : 'Paid in full'; }
  if (!ti) { const spent = -Math.min(0, x.activity); return spent && x.available === 0 && x.assigned + x.carry > 0 ? 'Fully Spent' : ''; }

/* ---------- auto-assign ---------- */
function autoOptions(m, cats) {
  const prev = addMonths(m, -1);
  const opts = {
    under: { l: 'Underfunded', f: c => { const ti = targetInfo(c, m); return ti ? getAssigned(m, c.id) + ti.under : null; } },
    lastA: { l: 'Assigned Last Month', f: c => catM(prev, c.id).assigned },
    lastS: { l: 'Spent Last Month', f: c => Math.max(0, -catM(prev, c.id).activity) },
    avgA: { l: 'Average Assigned', f: c => { const n = Math.max(1, Math.min(12, monthDiff(calc().minM, m))); let s = 0; for (let i = 1; i <= n; i++) s += catM(addMonths(m, -i), c.id).assigned; return Math.round(s / n); } },
    avgS: { l: 'Average Spent', f: c => { const n = Math.max(1, Math.min(12, monthDiff(calc().minM, m))); let s = 0; for (let i = 1; i <= n; i++) s += Math.max(0, -catM(addMonths(m, -i), c.id).activity); return Math.round(s / n); } },
    resetAv: { l: 'Reset Available Amounts', f: c => { const x = catM(m, c.id); return x.available > 0 ? getAssigned(m, c.id) - x.available : null; } },
    resetAs: { l: 'Reset Assigned Amounts', f: () => 0 },
  };
  const out = [];
  for (const [k, o] of Object.entries(opts)) {
    let delta = 0; const changes = [];
    for (const c of cats) { const v = o.f(c); if (v == null) continue; const cur = getAssigned(m, c.id); if (v !== cur) { delta += v - cur; changes.push([c.id, v]); } }
    out.push({ k, l: o.l, delta, changes });
  }
  return out;
}
function assignSheet() {
  const m = A.month; const cats = A.plan.cats.filter(c => !c.hidden);
  const opts = autoOptions(m, cats);
  const body = `<div class="small muted">Applies to every visible category in ${monthLabel(m)}. You can undo right after.</div>
    <div class="card">${opts.map(o => `<button class="li" data-a="autoApply" data-k="${o.k}" ${o.changes.length ? '' : 'disabled'}><span class="grow"><strong>${o.l}</strong><div class="small muted">${o.changes.length} categor${o.changes.length > 1 ? 'ies' : 'y'}</div></span><strong class="num ${o.delta > 0 ? '' : 'amt-pos'}">${o.delta > 0 ? '' : '+'}${fmt(-o.delta)}</strong></button>`).join('')}</div>

/* ---------- loan planner ---------- */
function loanSheet(id, extra = 0) {
  const a = L.acct[id], bal = -(balances()[id].working); const r = (a.rate || 0) / 100 / 12; const P = a.minPay || 0;
  const sim = pay => { let b = bal, n = 0, int = 0; if (pay <= 0) return null; while (b > 0 && n < 1200) { const i = Math.round(b * r); int += i; b = b + i - pay; n++; if (pay <= i) return null; } return { n, int }; };
  const base = sim(P), withX = sim(P + extra);
  const when = n => { const d = new Date(); d.setMonth(d.getMonth() + n); return cap(MONTHS[d.getMonth()]) + ' ' + d.getFullYear(); };
  const body = `<div class="kpis" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="kpi"><span>Balance</span><b class="num">${fmt(bal)}</b></div><div class="kpi"><span>Rate · payment</span><b class="num" style="font-size:16px">${(a.rate || 0).toLocaleString('fr-FR')} % · ${fmt(P)}</b></div></div>
    ${!P ? `<div class="banner warn">${I.info}<span>Add the interest rate and minimum payment in the account settings.</span><button class="btn sm" data-a="acctEdit" data-id="${id}">Edit</button></div>` : ''}
    <div class="field"><label for="lxRange">Extra monthly payment: <strong id="lxVal">${fmt(extra)}</strong></label><input id="lxRange" type="range" min="0" max="${Math.max(50000, Math.round(P * 2))}" step="1000" value="${extra}" data-c="loanX" data-id="${id}" style="width:100%; accent-color:var(--accent)"></div>
    <div class="card"><div class="li"><span class="grow">Current payoff date</span><strong>${base ? when(base.n) : '—'}</strong></div>
      <div class="li"><span class="grow">Remaining interest</span><strong class="num">${base ? fmt(base.int) : '—'}</strong></div>
      <div class="li"><span class="grow">With ${fmt(extra)} extra</span><strong>${withX ? when(withX.n) : '—'}</strong></div>
      <div class="li"><span class="grow">You save</span><strong class="amt-pos">${base && withX ? (base.n - withX.n) + ' months · ' + fmt(base.int - withX.int) : '—'}</strong></div></div>
    ${!base && P ? `<div class="banner bad">${I.info}<span>The payment does not cover the interest.</span></div>` : ''}
    <button class="btn pri block" data-a="loanTarget" data-id="${id}" data-x="${extra}">${I.target} Create debt payment category (${fmt(P + extra)} / month)</button>
    <button class="btn block" data-a="loanInterest" data-id="${id}">Add this month's interest (${fmt(Math.round(bal * r))})</button>`;
  if ($('#scrim') && $('#lxRange')) { refreshSheetBody(body); return; }
  openSheet('Loan Planner — ' + a.name, body);
}

/* ---------- file import (CSV / OFX / QFX / QIF) ---------- */
let IMP = null;
function importSheet(acctId) {
  IMP = { acct: acctId || A.plan.accounts.find(a => !a.closed && onBudget(a))?.id, rows: null, csv: null, map: null };
  const body = `<div class="field"><label for="impAcct">Compte</label><select id="impAcct" class="in">${acctOptions(IMP.acct)}</select></div>
    <label class="btn block" for="impFile">${I.file} Choose bank file</label><input id="impFile" type="file" accept=".csv,.txt,.ofx,.qfx,.qif,text/csv" hidden data-c="impFile">
    <div class="small muted">Supported: CSV (any bank), OFX, QFX, QIF. Duplicates are skipped, and transactions you already entered by hand are matched automatically.</div>
    <div id="impStep"></div>`;
  openSheet('File Import', body);
}
function decodeFile(buf) {
  let txt = new TextDecoder('utf-8').decode(buf);
  if (txt.includes('\uFFFD')) txt = new TextDecoder('windows-1252').decode(buf);
  return txt.replace(/^﻿/, '');
}
function parseCSV(txt) {
  const first = txt.split(/\r?\n/).find(l => l.trim()) || '';
  const cands = [';', ',', '\t', '|']; const delim = cands.sort((a, b) => first.split(b).length - first.split(a).length)[0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < txt.length; i++) {
    const ch = txt[i];
    if (q) { if (ch === '"') { if (txt[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cell.trim()); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && txt[i + 1] === '\n') i++; row.push(cell.trim()); if (row.some(c => c)) rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  row.push(cell.trim()); if (row.some(c => c)) rows.push(row);
  return rows;
}
function parseDateAny(s, fmtHint) {
  s = (s || '').trim().slice(0, 10);
  let m;
  if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  if ((m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/))) {
    let y = +m[3]; if (y < 100) y += 2000;
    const [d, mo] = fmtHint === 'mdy' ? [+m[2], +m[1]] : [+m[1], +m[2]];
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    return `${y}-${pad(mo)}-${pad(d)}`;
  }
  if ((m = s.match(/^(\d{4})(\d{2})(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}
function parseMoney(s) {
  s = String(s || '').replace(/[\s €$£]/g, '').replace(/−/g, '-');
  if (!s) return null;
  let neg = false; if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (s.endsWith('-')) { neg = true; s = s.slice(0, -1); }
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc > ld) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/,/g, '');
  const v = parseFloat(s); if (isNaN(v)) return null;
  return Math.round((neg ? -v : v) * 100);
}
function guessMap(head) {
  const h = head.map(x => x.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''));
  const find = (...keys) => h.findIndex(x => keys.some(k => x.includes(k)));
  return {
    date: find('date op', 'date de l', 'date', 'jour', 'booking'),
    payee: find('libelle', 'beneficiaire', 'description', 'payee', 'tiers', 'nom', 'label', 'intitule'),
    memo: find('memo', 'detail', 'note', 'commentaire', 'information', 'reference'),
    amount: find('montant', 'amount', 'somme', 'valeur'),
    out: find('debit', 'sortie', 'outflow', 'retrait'),
    in: find('credit', 'entree', 'inflow', 'versement'),
  };
}
async function onImportFile(file) {
  const buf = await file.arrayBuffer(); const txt = decodeFile(buf);
  IMP.acct = $('#impAcct').value;
  const name = file.name.toLowerCase();
  if (/\.(ofx|qfx)$/.test(name) || /<OFX>/i.test(txt)) { IMP.rows = parseOFX(txt); return impPreview(); }
  if (/\.qif$/.test(name) || /^!Type:/m.test(txt)) { IMP.rows = parseQIF(txt); return impPreview(); }
  const rows = parseCSV(txt);
  if (rows.length < 2) { $('#impStep').innerHTML = `<div class="banner bad">${I.info}<span>Fichier vide ou illisible.</span></div>`; return; }
  let hi = rows.findIndex(r => r.length >= 3 && r.some(c => /date/i.test(c))); if (hi < 0) hi = 0;
  IMP.csv = { head: rows[hi], body: rows.slice(hi + 1) };
  IMP.map = guessMap(rows[hi]);
  IMP.map.dfmt = 'dmy'; IMP.map.invert = false;
  impMapping();
}
function impMapping() {
  const { head, body } = IMP.csv, mp = IMP.map;
  const opts = (k, opt) => `<option value="-1">${opt ? '— none —' : 'Choose…'}</option>` + head.map((h, i) => `<option value="${i}" ${mp[k] === i ? 'selected' : ''}>${esc(h || 'Column ' + (i + 1))}</option>`).join('');
  const sample = body.slice(0, 3).map(r => `<tr>${head.map((_, i) => `<td>${esc(r[i] || '')}</td>`).join('')}</tr>`).join('');
  $('#impStep').innerHTML = `<div class="sec-t"><span>File columns</span></div>
    <div style="overflow-x:auto" class="card"><table class="tbl"><thead><tr>${head.map(h => `<th style="text-align:left">${esc(h)}</th>`).join('')}</tr></thead><tbody>${sample}</tbody></table></div>
    <div class="grid2">
      <div class="field"><label for="mpDate">Date</label><select id="mpDate" class="in" data-mp="date">${opts('date')}</select></div>
      <div class="field"><label for="mpFmt">Date format</label><select id="mpFmt" class="in" data-mp="dfmt"><option value="dmy" ${mp.dfmt === 'dmy' ? 'selected' : ''}>DD/MM/YYYY</option><option value="mdy" ${mp.dfmt === 'mdy' ? 'selected' : ''}>MM/DD/YYYY</option></select></div>
      <div class="field"><label for="mpPayee">Payee / description</label><select id="mpPayee" class="in" data-mp="payee">${opts('payee')}</select></div>
      <div class="field"><label for="mpMemo">Memo</label><select id="mpMemo" class="in" data-mp="memo">${opts('memo', 1)}</select></div>
      <div class="field"><label for="mpAmt">Amount (single column)</label><select id="mpAmt" class="in" data-mp="amount">${opts('amount', 1)}</select></div>
      <div class="field"><label for="mpOut">Or Outflow</label><select id="mpOut" class="in" data-mp="out">${opts('out', 1)}</select></div>
      <div class="field"><label for="mpIn">and Inflow</label><select id="mpIn" class="in" data-mp="in">${opts('in', 1)}</select></div>
      <label class="switch"><span class="small"><strong>Flip amounts</strong></span><input type="checkbox" data-mp="invert" ${mp.invert ? 'checked' : ''}></label>
    </div>
    <button class="btn pri block" data-a="impBuild">Preview import</button>`;
}
function impBuildCSV() {
  const { body } = IMP.csv, mp = IMP.map; const out = [];
  for (const r of body) {
    const date = parseDateAny(r[mp.date], mp.dfmt); if (!date) continue;
    let amt = null;
    if (mp.amount >= 0 && r[mp.amount]) amt = parseMoney(r[mp.amount]);
    else { const o = mp.out >= 0 ? parseMoney(r[mp.out]) : null, i = mp.in >= 0 ? parseMoney(r[mp.in]) : null; if (o != null || i != null) amt = (i ? Math.abs(i) : 0) - (o ? Math.abs(o) : 0); }
    if (amt == null || amt === 0) continue;
    if (mp.invert) amt = -amt;
    out.push({ date, amount: amt, payee: (r[mp.payee] || '').replace(/\s+/g, ' ').trim(), memo: mp.memo >= 0 ? (r[mp.memo] || '').trim() : '' });
  }
  IMP.rows = out; impPreview();
}
function parseOFX(txt) {
  const out = []; const blocks = txt.split(/<STMTTRN>/i).slice(1);
  const tag = (b, t) => { const m = b.match(new RegExp('<' + t + '>([^<\\r\\n]*)', 'i')); return m ? m[1].trim() : ''; };
  for (const b of blocks) { const date = parseDateAny(tag(b, 'DTPOSTED')); const amount = parseMoney(tag(b, 'TRNAMT')); if (!date || amount == null) continue; out.push({ date, amount, payee: tag(b, 'NAME') || tag(b, 'PAYEE'), memo: tag(b, 'MEMO'), fitid: tag(b, 'FITID') }); }
  return out;
}
function parseQIF(txt) {
  const out = []; let cur = {};
  for (const line of txt.split(/\r?\n/)) {
    const k = line[0], v = line.slice(1).trim();
    if (k === 'D') cur.date = parseDateAny(v.replace(/'/g, '/'), 'dmy');
    else if (k === 'T' || k === 'U') cur.amount = parseMoney(v);
    else if (k === 'P') cur.payee = v; else if (k === 'M') cur.memo = v;
    else if (k === '^') { if (cur.date && cur.amount != null) out.push({ payee: '', memo: '', ...cur }); cur = {}; }
  }
  return out;
}
function impPlan() {
  const acct = IMP.acct; const existing = A.tx.filter(t => t.acct === acct);
  const ids = new Set(existing.map(t => t.importId).filter(Boolean)); const used = new Set();
  const res = [];
  const seen = {};
  for (const r of IMP.rows) {
    const key0 = r.fitid || `${r.date}|${r.amount}|${r.payee.toLowerCase()}`;
    seen[key0] = (seen[key0] || 0) + 1; const key = r.fitid ? key0 : key0 + '|' + seen[key0];
    if (ids.has(key)) { res.push({ r, key, kind: 'dup' }); continue; }
    const match = existing.find(t => !t.importId && !used.has(t.id) && t.amount === r.amount && Math.abs(daysBetween(t.date, r.date)) <= 10);
    if (match) { used.add(match.id); res.push({ r, key, kind: 'match', t: match }); continue; }
    res.push({ r, key, kind: 'new' });
  }

/* ---------- housekeeping at start: bank lines dated in the future are not real yet ---------- */
function dropFutureBankLines() {
  if (!A.plan) return; const today = todayISO();
  const fut = A.tx.filter(t => t.importId && /^ebp?:/.test(t.importId) && !t.approved && t.date > today).map(t => t.id);
  if (fut.length) { A.tx = A.tx.filter(t => !fut.includes(t.id)); scheduleSave(); render(); }
}
setTimeout(dropFutureBankLines, 1500);

/* ---------- click on a category in the register: quick picker, best guesses first ---------- */
function suggestCats(t) {
  const out = [], add = c => { if (c && c !== '__start' && (c === 'rta' || (L.cat[c] && !L.cat[c].cc && !L.cat[c].hidden)) && !out.includes(c)) out.push(c); };
  const a = L.acct[t.acct]; const y = L.payee[t.payee]; const raw = t.rawPayee || y?.name || '';
  if (t.amount > 0 && onBudget(a) && !isCredit(a)) add('rta');
  try { const g = (typeof learnedPayee === 'function' && learnedPayee(raw)) || (typeof guessPayee === 'function' && guessPayee(raw)); add(g?.lastCat); } catch (e) { }
  add(y?.lastCat);
  // a category whose name appears in the bank label (e.g. “PHARMACIE …” → Santé/Pharmacie)
  const words = new Set(norm(raw + ' ' + (y?.name || '')).split(/[^\p{L}]+/u).filter(w => w.length >= 4));
  for (const c of A.plan.cats) if (!c.cc && !c.hidden && norm(c.name).split(/[^\p{L}]+/u).some(w => w.length >= 4 && words.has(w))) add(c.id);
  // past payees whose name appears in the label (e.g. a payee “IONOS” you used before)
  for (const p of A.plan.payees) { const pn = norm(p.name.replace(/^\p{Extended_Pictographic}\s*/u, '')); if (p.lastCat && pn.length >= 4 && (words.has(pn) || norm(raw).includes(pn))) add(p.lastCat); }
  // what you chose for similar payees, then your most used categories lately
  const key = norm((typeof cleanPayee === 'function' ? cleanPayee(raw) : raw)).split(' ')[0] || '';
  const cnt = {}, recent = {}; const since = addDays(todayISO(), -120);
  for (const x of A.tx) {
    if (!x.cat || x === t) continue;
    const n = norm(payeeName(x) || '');
    if (key.length >= 3 && n.split(' ')[0] === key) cnt[x.cat] = (cnt[x.cat] || 0) + 3;
    if (x.date >= since && Math.sign(x.amount) === Math.sign(t.amount)) recent[x.cat] = (recent[x.cat] || 0) + 1;
  }
  Object.entries(cnt).sort((p, q) => q[1] - p[1]).forEach(([c]) => add(c));
  Object.entries(recent).sort((p, q) => q[1] - p[1]).forEach(([c]) => add(c));
  return out;
}
function catPickList(t, q) {
  q = norm(q || '');
  const sug = q ? [] : suggestCats(t).slice(0, 5);
  const row = c => `<button class="pm-i" data-a="catPickDo" data-c="${c}" data-id="${t.id}"><span class="grow">${esc(c === 'rta' ? 'Inflow: Ready to Assign' : catName(c))}</span>${c !== 'rta' ? `<span class="small muted num">${fmt(catM(monthOf(t.date), c).available)}</span>` : ''}</button>`;
  const raw = t.rawPayee || L.payee[t.payee]?.name || '';
  const trTo = !q && typeof ownAcctInLabel === 'function' ? ownAcctInLabel(raw, t.acct) : null;
  const trRow = id => `<button class="pm-i" data-a="catPickTr" data-ac="${id}" data-id="${t.id}"><span class="grow">${t.amount < 0 ? 'Transfer to' : 'Transfer from'} ${esc(L.acct[id].name)}</span><span class="small muted">no category</span></button>`;
  let h = (trTo ? `<div class="pm-h">Looks like a transfer</div>` + trRow(trTo) + msep : '') + (sug.length ? `<div class="pm-h">Suggested</div>` + sug.map(row).join('') + msep : '');
  for (const g of A.plan.groups) {
    if (g.sys === 'cc') continue;
    const cats = A.plan.cats.filter(c => c.gid === g.id && !c.hidden && (!q || norm(catName(c.id)).includes(q) || norm(g.name).includes(q)));
    if (cats.length) h += `<div class="pm-h">${esc(g.name)}</div>` + cats.map(c => row(c.id)).join('');
  }
  if (!q || 'inflow ready to assign'.includes(q)) h += msep + row('rta');
  const accs = A.plan.accounts.filter(a => a.id !== t.acct && !a.closed && (!q || norm(a.name).includes(q) || 'transfer'.includes(q) || q.startsWith('transf')));
  if (accs.length) h += msep + `<div class="pm-h">Transfer (no category)</div>` + accs.map(a => trRow(a.id)).join('');
  return h || '<div class="pm-h">No category found</div>';
}

/* ---------- Apple Pay: an iPhone Shortcut sends each payment to your script; the app picks them up ---------- */
function apParseAmount(v) { let s = String(v || '').replace(/[^\d,.\-]/g, ''); if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(',', '.'); const n = Math.round(parseFloat(s) * 100); return isFinite(n) ? n : 0; }
function apAccount(card) {
  const w = new Set(norm(card || '').split(/[^\p{L}\p{N}]+/u).filter(x => x.length >= 2));
  const open = A.plan.accounts.filter(a => !a.closed && onBudget(a));
  let best = null, score = 0;
  for (const a of open) { const s = norm(a.name).split(/[^\p{L}\p{N}]+/u).filter(x => w.has(x)).length; if (s > score) { best = a; score = s; } }
  if (best) return best.id;
  try { const last = localStorage.getItem('budget.apAcct'); if (last && L.acct[last]) return last; } catch (e) { }
  return (open.find(a => isCredit(a)) || open[0])?.id;
}
let apBusy = false;
async function applePayPull() {
  if (apBusy || !A.plan || typeof viaScript !== 'function' || !viaScript()) return; apBusy = true;
  try {
    const r = await px('inboxTake'); const items = r.items || []; if (!items.length) return;
    let last = null;
    mutate(items.length > 1 ? items.length + ' Apple Pay payments added' : 'Apple Pay payment added', () => {
      for (const it of items) {
        const amt = -Math.abs(apParseAmount(it.amount)); if (!amt) continue;
        const acct = apAccount(it.card); if (!acct) continue;
        const raw = it.payee || 'Apple Pay';
        const y = (typeof learnedPayee === 'function' && learnedPayee(raw)) || getPayee(typeof cleanPayee === 'function' ? cleanPayee(raw) : raw);
        const t = { id: uid(), acct, date: isoOf(new Date(it.at || Date.now())), payee: y.id, cat: y.lastCat && L.cat[y.lastCat] ? y.lastCat : null, memo: 'Apple Pay' + (it.card ? ' · ' + it.card : ''), amount: amt, cleared: 'u', flag: null, approved: false, rawPayee: raw };
        A.tx.push(t); last = t;
      }
    });
    if (last && document.visibilityState === 'visible') setTimeout(() => txSheet(last.id), 200);
  } catch (e) { if (e.code !== 'unknown_action') console.warn('applePay', e); }
  finally { apBusy = false; }
}
setTimeout(applePayPull, 2500);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') setTimeout(applePayPull, 800); });
