<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E3A8A"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mon budget</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one mobile-first column (max 820px) — sticky month header, scrolling envelopes, fixed bottom tab bar, bottom sheets for every edit */
:root{
  --bg:#F1F3F8; --surface:#FFFFFF; --surface-2:#E7EBF3; --fg:#131A2C; --muted:#535C70; --line:#DCE1EC;
  --accent:#1E3A8A; --accent-ink:#FFFFFF; --accent-soft:#DDE5F8; --accent-strong:#1E3A8A;
  --good:#17663F; --good-soft:#D6F0E1; --hero:#1E3A8A; --hero-ink:#FFFFFF;
  --warn:#8F5300; --warn-soft:#FCEACB; --bad:#B42318; --bad-soft:#FBDFDA; --zero-soft:#E4E8F0;
  --info:#1E3A8A; --info-soft:#E1E8FA; --scrim:rgba(8,14,32,.45); --shadow:0 10px 30px rgba(12,22,52,.16);
  --f-display:'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', sans-serif;
  --f-body:'Manrope', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --r-s:10px; --r-m:16px; --r-l:22px;
  --flag-red:#D64545; --flag-orange:#E07B22; --flag-yellow:#D4A514; --flag-green:#2E9A5E; --flag-blue:#3B6FD8; --flag-purple:#8A55D0;
  --c1:#1E3A8A; --c2:#17824F; --c3:#C26A1B; --c4:#7C4DC4; --c5:#B8336A; --c6:#2A8C9B; --c7:#7A8B2E; --c8:#6B7280;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A1122; --surface:#111A30; --surface-2:#1A2440; --fg:#E7ECF7; --muted:#9AA6BF; --line:#25304D;
  --accent:#86A8FF; --accent-ink:#081128; --accent-soft:#1C2A52; --accent-strong:#B3C8FF;
  --good:#6FD3A0; --good-soft:#123528; --hero:#2A4AA8; --hero-ink:#FFFFFF;
  --warn:#F2B35C; --warn-soft:#3A2B12; --bad:#F48C7E; --bad-soft:#3F1E1A; --zero-soft:#1F2945;
  --info:#9DB6FF; --info-soft:#1A2750; --scrim:rgba(0,0,0,.6); --shadow:0 10px 30px rgba(0,0,0,.55);
  --c1:#86A8FF; --c2:#6FD3A0; --c3:#F0A050; --c4:#B894F0; --c5:#F07AA8; --c6:#5CC4D2; --c7:#B8C960; --c8:#A0A8B3;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0A1122; --surface:#111A30; --surface-2:#1A2440; --fg:#E7ECF7; --muted:#9AA6BF; --line:#25304D;
  --accent:#86A8FF; --accent-ink:#081128; --accent-soft:#1C2A52; --accent-strong:#B3C8FF;
  --good:#6FD3A0; --good-soft:#123528; --hero:#2A4AA8; --hero-ink:#FFFFFF;
  --warn:#F2B35C; --warn-soft:#3A2B12; --bad:#F48C7E; --bad-soft:#3F1E1A; --zero-soft:#1F2945;
  --info:#9DB6FF; --info-soft:#1A2750; --scrim:rgba(0,0,0,.6); --shadow:0 10px 30px rgba(0,0,0,.55);
  --c1:#86A8FF; --c2:#6FD3A0; --c3:#F0A050; --c4:#B894F0; --c5:#F07AA8; --c6:#5CC4D2; --c7:#B8C960; --c8:#A0A8B3;
  color-scheme:dark }
html,body{height:100%}
body{background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.4; -webkit-tap-highlight-color:transparent}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display); text-wrap:balance; margin:0}
#app{max-width:820px; margin:0 auto; min-height:100%; padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex; align-items:center; gap:10px}
.between{justify-content:space-between}
.grow{flex:1; min-width:0}
.ellip{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* header */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); padding-block:10px 8px}
.top-bar{display:flex; align-items:center; gap:6px}
.top-title{flex:1; min-width:0; text-align:center}
.top-title h1{font-size:21px; line-height:1.15}
.top-title .sub{font-size:12px; color:var(--muted); font-weight:600}
button > svg, label > svg, a > svg, .li > svg{width:20px; height:20px; flex:none}
.li > svg{color:var(--muted)}
.ibtn{width:44px; height:44px; border:none; background:transparent; border-radius:12px; display:inline-flex; align-items:center; justify-content:center; color:var(--fg); flex:none}
.ibtn:hover{background:var(--surface-2)}
.ibtn:disabled{opacity:.35; cursor:default}
.ibtn svg{width:21px; height:21px}

/* ready to assign */
.rta{margin-top:8px; border-radius:var(--r-l); padding:14px 16px; display:flex; align-items:center; gap:12px; border:none; width:100%; text-align:left}
.rta.pos{background:var(--hero); color:var(--hero-ink)}
.rta.zero{background:var(--surface); color:var(--fg); border:1px solid var(--line)}
.rta.neg{background:var(--bad); color:#fff}
.rta .lbl{font-size:13px; font-weight:700; opacity:.92}
.rta .amt{font-family:var(--f-display); font-weight:700; font-size:30px; line-height:1.05}
.rta .cta{margin-left:auto; display:inline-flex; align-items:center; height:44px; padding:0 16px; border-radius:999px; border:none; background:var(--hero-ink); color:var(--hero); font-weight:800; font-size:14px; flex:none}
.rta.neg .cta{color:var(--bad)}
.rta.zero .cta{background:var(--accent-soft); color:var(--accent-strong)}
.stats{display:flex; gap:8px; margin-top:10px; overflow-x:auto; scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stat{flex:none; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); padding:8px 12px; min-width:0; text-align:left}
.stat b{display:block; font-size:15px}
.stat span{font-size:11.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.05em}
.chips{display:flex; gap:6px; overflow-x:auto; padding-block:10px 4px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; height:36px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-weight:700; font-size:13px; color:var(--muted); display:inline-flex; align-items:center; gap:6px}
.chip.on{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.chip svg{width:16px; height:16px}

/* plan list */
.colhead{display:flex; justify-content:flex-end; gap:8px; padding:8px 4px 4px; font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.colhead .c-name{margin-right:auto}
.w-ass{width:78px; text-align:right; flex:none}
.w-act{width:84px; text-align:right; flex:none}
.w-av{width:90px; text-align:right; flex:none}
.hide-s{display:none}
@media (min-width:640px){ .hide-s{display:block} }
.group{background:var(--surface); border-radius:var(--r-l); margin-top:10px; overflow:hidden; border:1px solid var(--line)}
.ghead{display:flex; align-items:center; gap:8px; padding:6px 12px 6px 6px; min-height:48px; background:var(--surface)}
.ghead .gname{font-family:var(--f-display); font-weight:600; font-size:15.5px; flex:1; min-width:0; text-align:left; border:none; background:none; display:flex; align-items:center; gap:4px; padding:6px}
.ghead .gname svg{width:18px; height:18px; transition:transform .15s}
.ghead.collapsed .gname svg{transform:rotate(-90deg)}
.ghead .gsum{font-size:12.5px; color:var(--muted); font-weight:700}
.cat{display:flex; align-items:center; gap:8px; padding:10px 12px; border-top:1px solid var(--line); min-height:56px}
.cat .cname{flex:1; min-width:0; border:none; background:none; text-align:left; padding:0; display:flex; flex-direction:column; gap:5px}
.cat .cname .t{font-weight:700; font-size:15px; line-height:1.25; overflow-wrap:anywhere}
.cat .cname .note{font-size:12px; color:var(--muted); font-weight:600}
.cat.sel{background:var(--accent-soft)}
.ass-in{width:78px; height:36px; border:1px solid transparent; background:var(--surface-2); border-radius:9px; text-align:right; padding:0 8px; font-weight:700; font-size:14px; font-variant-numeric:tabular-nums}
.ass-in:focus{border-color:var(--accent); background:var(--surface); outline:none}
.pill{display:inline-flex; justify-content:flex-end; align-items:center; min-width:0; max-width:90px; height:30px; padding:0 9px; border-radius:999px; font-weight:800; font-size:13.5px; border:none; font-variant-numeric:tabular-nums; white-space:nowrap}
.pill.good{background:var(--good-soft); color:var(--good)}
.pill.zero{background:var(--zero-soft); color:var(--muted)}
.pill.warn{background:var(--warn-soft); color:var(--warn)}
.pill.bad{background:var(--bad-soft); color:var(--bad)}
.pill.credit{background:var(--warn-soft); color:var(--warn); outline:2px dashed var(--warn); outline-offset:-2px}
.bar{height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden; width:100%}
.bar > i{display:block; height:100%; border-radius:999px; background:var(--good)}
.bar.warn > i{background:var(--warn)}
.bar.bad > i{background:var(--bad)}
.editrow{display:flex; gap:4px; flex:none}
.editrow .ibtn{width:36px; height:36px}
.editrow .ibtn svg{width:18px; height:18px}
.addline{display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line)}

/* banners */
.banner{display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:var(--r-m); margin-top:10px; font-weight:700; font-size:13.5px}
.banner.warn{background:var(--warn-soft); color:var(--warn)}
.banner.bad{background:var(--bad-soft); color:var(--bad)}
.banner.info{background:var(--info-soft); color:var(--info)}
.banner .btn{margin-left:auto; flex:none}
.banner > svg{width:20px; height:20px; flex:none}

/* buttons & fields */
.btn{height:44px; padding:0 16px; border-radius:12px; border:1px solid var(--line); background:var(--surface); font-weight:800; font-size:14px; display:inline-flex; align-items:center; justify-content:center; gap:8px; white-space:nowrap}
.btn svg{width:18px; height:18px}
.btn.pri{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.danger{color:var(--bad); border-color:var(--bad-soft); background:var(--bad-soft)}
.btn.ghost{background:transparent; border-color:transparent}
.btn.sm{height:36px; padding:0 12px; font-size:13px; border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45; cursor:default}
.field{display:flex; flex-direction:column; gap:6px}
.field > label, .lbl2{font-size:12px; font-weight:800; color:var(--muted); letter-spacing:.04em; text-transform:uppercase}
.in, select.in, textarea.in{height:46px; border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:0 12px; width:100%; font-size:16px; min-width:0}
textarea.in{height:auto; min-height:70px; padding:10px 12px; resize:vertical}
.in:focus{outline:none; border-color:var(--accent)}
.grid2{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px}
.seg{display:flex; background:var(--surface-2); border-radius:12px; padding:3px; gap:3px}
.seg button{flex:1; height:40px; border:none; border-radius:9px; background:transparent; font-weight:800; font-size:13.5px; color:var(--muted)}
.seg button.on{background:var(--surface); color:var(--fg); box-shadow:0 1px 3px rgba(0,0,0,.12)}
.switch{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:48px}
.switch input{width:22px; height:22px; accent-color:var(--accent)}

/* lists */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); overflow:hidden}
.li{display:flex; align-items:center; gap:12px; padding:12px 14px; border-top:1px solid var(--line); min-height:56px; background:none; border-left:none; border-right:none; border-bottom:none; width:100%; text-align:left}
.li:first-child{border-top:none}
button.li:hover{background:var(--surface-2)}
.li .ic{width:36px; height:36px; border-radius:11px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; flex:none; color:var(--muted)}
.li .ic svg{width:19px; height:19px}
.sec-t{font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:18px 4px 8px; display:flex; justify-content:space-between; align-items:center}
.amt-pos{color:var(--good)}
.amt-neg{color:var(--fg)}
.amt-bad{color:var(--bad)}

/* register */
.tx{display:flex; align-items:center; gap:10px; padding:10px 12px; border-top:1px solid var(--line); min-height:60px}
.tx:first-child{border-top:none}
.tx .main{flex:1; min-width:0; border:none; background:none; text-align:left; padding:0; display:flex; flex-direction:column; gap:3px}
.tx .p{font-weight:700; font-size:15px}
.tx .c{font-size:12.5px; color:var(--muted); font-weight:600}
.tx .c.todo{color:var(--warn); font-weight:800}
.tx .a{font-weight:800; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
.tx .rb{font-size:11.5px; color:var(--muted); font-weight:600; text-align:right}
.tx.unapproved{background:color-mix(in srgb, var(--info-soft) 60%, transparent)}
.clr{width:30px; height:30px; border-radius:999px; border:2px solid var(--line); background:transparent; font-size:12px; font-weight:800; color:var(--muted); flex:none; display:flex; align-items:center; justify-content:center}
.clr.c{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.clr.r{background:var(--fg); border-color:var(--fg); color:var(--bg)}
.flag{width:8px; height:28px; border-radius:4px; flex:none}
.chk{width:22px; height:22px; accent-color:var(--accent); flex:none}
.day{font-size:12px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); padding:14px 4px 6px}
.actionbar{position:fixed; left:0; right:0; bottom:calc(68px + env(safe-area-inset-bottom,0px)); z-index:25; display:flex; justify-content:center; padding-left:max(12px, env(safe-area-inset-left,0px)); padding-right:max(12px, env(safe-area-inset-right,0px))}
.actionbar > div{background:var(--fg); color:var(--bg); border-radius:18px; padding:8px; display:flex; gap:4px; align-items:center; box-shadow:var(--shadow); overflow-x:auto; max-width:100%}
.actionbar button{height:40px; padding:0 12px; border:none; border-radius:12px; background:transparent; color:var(--bg); font-weight:800; font-size:13px; white-space:nowrap}
.actionbar button:hover{background:rgba(127,127,127,.25)}

/* nav */
.nav{position:fixed; left:0; right:0; bottom:0; z-index:22; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px)}
.nav > div{max-width:820px; margin:0 auto; display:grid; grid-template-columns:repeat(5, minmax(0,1fr))}
.nav button{height:64px; min-width:0; padding:0 2px; border:none; background:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:11px; font-weight:800; color:var(--muted)}
.nav button svg{width:23px; height:23px}
.nav button.on{color:var(--accent)}
.fab{position:fixed; z-index:23; right:max(18px, calc(env(safe-area-inset-right,0px) + 18px)); bottom:calc(80px + env(safe-area-inset-bottom,0px)); width:58px; height:58px; border-radius:20px; border:none; background:var(--accent); color:var(--accent-ink); box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center}
.fab svg{width:26px; height:26px}
@media (min-width:860px){ .fab{right:calc(50% - 410px + 18px)} }

/* sheet */
.scrim{position:fixed; inset:0; background:var(--scrim); z-index:40; display:flex; align-items:flex-end; justify-content:center; animation:fade .15s ease}
.sheet{background:var(--bg); width:100%; max-width:640px; max-height:92vh; border-radius:24px 24px 0 0; display:flex; flex-direction:column; box-shadow:var(--shadow); animation:up .22s cubic-bezier(.2,.9,.3,1); padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){ .scrim{align-items:center} .sheet{border-radius:24px; max-height:86vh} }
.sheet-h{display:flex; align-items:center; gap:6px; padding:10px max(10px, env(safe-area-inset-right,0px)) 6px max(10px, env(safe-area-inset-left,0px)); border-bottom:1px solid var(--line)}
.sheet-h h2{flex:1; font-size:18px; text-align:center; min-width:0}
.sheet-b > *{flex-shrink:0}
.sheet-b{overflow-y:auto; padding-block:14px 20px; display:flex; flex-direction:column; gap:14px}
.sheet-f{padding-block:10px; border-top:1px solid var(--line); display:flex; gap:10px}
@keyframes up{from{transform:translateY(40px); opacity:.4}to{transform:none; opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){ .sheet,.scrim{animation:none} .ghead .gname svg{transition:none} }
.bigamt{font-family:var(--f-display); font-size:38px; font-weight:700; text-align:center; border:none; background:transparent; width:100%; height:58px; font-variant-numeric:tabular-nums}
.bigamt:focus{outline:none}
.bigamt.out{color:var(--fg)} .bigamt.in{color:var(--good)}
.flags{display:flex; gap:8px; flex-wrap:wrap}
.flags button{width:40px; height:40px; border-radius:12px; border:2px solid transparent}
.flags button.on{border-color:var(--fg)}
.split{display:grid; grid-template-columns:minmax(0,1fr) 110px 40px; gap:8px; align-items:center}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(150px + env(safe-area-inset-bottom,0px)); z-index:60; background:var(--fg); color:var(--bg); border-radius:14px; padding:10px 10px 10px 16px; display:flex; gap:10px; align-items:center; font-weight:700; font-size:14px; box-shadow:var(--shadow); max-width:calc(100% - 32px)}
.toast button{border:none; background:transparent; color:var(--accent-soft); font-weight:800; height:36px; padding:0 10px; border-radius:10px}

/* reflect */
.kpis{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px}
@media (min-width:640px){ .kpis{grid-template-columns:repeat(4, minmax(0,1fr))} }
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); padding:12px 14px; min-width:0}
.kpi span{font-size:11.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--muted)}
.kpi b{display:block; font-family:var(--f-display); font-size:21px; margin-top:2px}
.chartbox{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); padding:14px; overflow-x:auto}
.chartbox svg{display:block; width:100%; height:auto}
.legend{display:flex; flex-direction:column; gap:2px; margin-top:8px}
.legend .li{padding:8px 4px; min-height:44px}
.dot{width:12px; height:12px; border-radius:4px; flex:none}
.tbl{width:100%; border-collapse:collapse; font-size:13.5px; font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:9px 8px; text-align:right; border-top:1px solid var(--line); white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left; position:sticky; left:0; background:var(--surface)}
.tbl thead th{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); border-top:none}
.tbl tr.tot td{font-weight:800}

/* onboarding */
.hero{padding-block:48px 24px; display:flex; flex-direction:column; gap:16px}
.hero h1{font-size:40px; line-height:1.02}
.hero p{font-size:16px; color:var(--muted); max-width:34em; margin:0}
.steps{display:flex; flex-direction:column; gap:10px}
.stepc{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); padding:14px; display:flex; gap:12px; align-items:flex-start}
.stepc b{font-family:var(--f-display); font-size:20px; color:var(--accent); width:26px; flex:none}

const FREQ = {

  switch (f) {

      const carry = pc && pc.available > 0 ? pc.available : 0;
      const a = p.assigned[m]?.[c.id] || 0;
      const activity = (fundedTo[c.cc] || 0) - (ccPay[m]?.[c.cc] || 0);
      const available = carry + a + activity;
      const cashOver = available < 0 ? -available : 0;

function catM(m, id) { return monthData(m).cats[id] || { carry: 0, assigned: 0, activity: 0, available: 0, cashOver: 0, creditOver: 0 }; }

/* ---------- targets ---------- */
const TARGET_TYPES = {
  monthly: 'Chaque mois', weekly: 'Chaque semaine', yearly: 'Chaque année', date: 'À une date', balance: 'Avoir un solde de', debt: 'Remboursement mensuel'

  switch (t.type) {
    case 'monthly': case 'weekly': case 'debt': {

      funded = (t.mode === 'refill' && t.type !== 'debt') ? x.carry + x.assigned : x.assigned;
      need = total; break;

    case 'yearly': case 'date': case 'balance': {
      const due = (t.type === 'balance' && !t.date) ? null : dueMonth(t, m);
      base = x.carry;
      if (!due) { need = Math.max(0, t.amount - base); }
      else { const left = Math.max(1, monthDiff(m, due) + 1); need = Math.max(0, Math.ceil((t.amount - base) / left)); }

  else if (under > 0) label = 'Encore ' + fmt(under) + ' ce mois-ci';
  else if (['yearly', 'date', 'balance'].includes(t.type) && x.carry + x.assigned >= t.amount) label = 'Objectif atteint';

/* ---------- age of money ---------- */

function ageOfMoney() {

    const a = L.acct[t.acct]; if (!onBudget(a) || isCredit(a)) continue;
    if (t.transferAcct && onBudget(L.acct[t.transferAcct]) && !isCredit(L.acct[t.transferAcct])) continue;
    if (t.amount > 0) inflows.push({ date: t.date, left: t.amount }); else if (t.amount < 0) outflows.push({ date: t.date, amt: -t.amount });

    <div class="sec-t" style="padding-top:4px"><span>Répartition automatique</span></div>
    <div class="card">${quick.map(([l, v]) => `<button class="li" data-a="setAssign" data-c="${cid}" data-v="${v}"><span class="grow">${l}</span><strong class="num">${fmt(v)}</strong></button>`).join('')}</div>
    ${c.cc ? ccInfo(c) : targetEditor(c)}

      <div class="field"><label for="cName">Nom</label><input id="cName" class="in" value="${esc(c.name)}" data-cf="name" data-c="${cid}" ${c.cc ? 'disabled' : ''}></div>
    </div>
    <div class="field"><label for="cNote">Note</label><textarea id="cNote" class="in" data-cf="note" data-c="${cid}" placeholder="Ex. : loyer payé le 5">${esc(c.note || '')}</textarea></div>
    ${!c.cc ? `<div class="field"><label for="cGroup">Groupe</label><select id="cGroup" class="in" data-cf="gid" data-c="${cid}">${A.plan.groups.filter(g => !g.sys).map(g => `<option value="${g.id}" ${g.id === c.gid ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select></div>` : ''}
    <div class="sec-t"><span>Opérations de ${monthLabel(m)}</span><span class="num">${recent.length}</span></div>
    ${recent.length ? `<div class="card">${recent.slice(0, 30).map(t => txRow(t, true)).join('')}</div>` : `<div class="muted small">Aucune opération ce mois-ci.</div>`}
    ${!c.cc ? `<div class="row" style="margin-top:6px"><button class="btn grow" data-a="cHide" data-c="${cid}">${c.hidden ? I.eye + ' Afficher' : I.eyeoff + ' Masquer'}</button><button class="btn danger grow" data-a="catDelete" data-c="${cid}">${I.trash} Supprimer</button></div>` : ''}`;
  openSheet(c.name, body);
}
function ccInfo(c) {
  const bal = balances()[c.cc]?.working || 0, x = catM(A.month, c.id);
  const gap = -bal - x.available;
  return `<div class="sec-t"><span>Carte de crédit</span></div><div class="card">
    <div class="li"><span class="grow">Solde de la carte</span><strong class="num">${fmt(bal)}</strong></div>
    <div class="li"><span class="grow">Prêt pour le paiement</span><strong class="num">${fmt(x.available)}</strong></div>
    <div class="li"><span class="grow">${gap > 0 ? 'Il manque pour tout payer' : 'Payée en totalité'}</span><strong class="num">${gap > 0 ? fmt(gap) : '✓'}</strong></div></div>
    ${gap > 0 ? `<button class="btn block" data-a="setAssign" data-c="${c.id}" data-v="${getAssigned(A.month, c.id) + gap}">Répartir ${fmt(gap)} pour solder la carte</button>` : ''}
    <button class="btn pri block" data-a="ccPay" data-id="${c.cc}">${I.swap} Enregistrer un paiement</button>`;
}
function targetEditor(c) {

  return `<div class="sec-t"><span>Objectif</span>${ti ? `<span>${Math.round(ti.pct * 100)} %</span>` : ''}</div>
  <div class="card" style="padding:14px; display:flex; flex-direction:column; gap:12px" id="tgtBox">
    <div class="field"><label for="tType">Type d'objectif</label><select id="tType" class="in" data-tf="type" data-c="${c.id}">
      ${opt('', 'Aucun objectif', type)}${Object.entries(TARGET_TYPES).map(([k, l]) => opt(k, l, type)).join('')}</select></div>
    ${type ? `<div class="field"><label for="tAmt">Montant</label><input id="tAmt" class="in" inputmode="decimal" value="${t.amount ? fmtIn(t.amount) : ''}" placeholder="0,00" data-tf="amount" data-c="${c.id}"></div>` : ''}
    ${type === 'weekly' ? `<div class="field"><label for="tWd">Chaque</label><select id="tWd" class="in" data-tf="weekday" data-c="${c.id}">${[1, 2, 3, 4, 5, 6, 0].map(d => opt(d, cap(DAYS[d]), wd)).join('')}</select></div>` : ''}
    ${type === 'yearly' ? `<div class="field"><label for="tMo">Pour le mois de</label><select id="tMo" class="in" data-tf="month" data-c="${c.id}">${MONTHS.map((n, i) => opt(i + 1, cap(n), t.month || 12)).join('')}</select></div>` : ''}
    ${type === 'date' || type === 'balance' ? `<div class="field"><label for="tDate">${type === 'balance' ? 'Avant (facultatif)' : 'Avant le mois de'}</label><input id="tDate" class="in" type="month" value="${t.date || ''}" data-tf="date" data-c="${c.id}"></div>` : ''}
    ${type === 'date' ? `<div class="field"><label for="tRep">Répéter</label><select id="tRep" class="in" data-tf="repeat" data-c="${c.id}">${opt(0, 'Ne pas répéter', t.repeat || 0)}${opt(1, 'Tous les mois', t.repeat)}${opt(3, 'Tous les 3 mois', t.repeat)}${opt(6, 'Tous les 6 mois', t.repeat)}${opt(12, 'Tous les ans', t.repeat)}${opt(24, 'Tous les 2 ans', t.repeat)}</select></div>` : ''}
    ${type === 'monthly' || type === 'weekly' ? `<div class="seg" role="group" aria-label="Mode">
      <button class="${t.mode !== 'refill' ? 'on' : ''}" data-a="tMode" data-c="${c.id}" data-v="set">Mettre de côté</button>
      <button class="${t.mode === 'refill' ? 'on' : ''}" data-a="tMode" data-c="${c.id}" data-v="refill">Remplir jusqu'à</button></div>
      <div class="small muted">${t.mode === 'refill' ? 'Le disponible est complété jusqu\'au montant (le reste du mois précédent compte).' : 'Le montant est ajouté chaque mois, même s\'il reste de l\'argent.'}</div>` : ''}
    ${type ? `<div class="field"><label for="tStart">À partir de</label><input id="tStart" class="in" type="month" value="${t.start || ''}" data-tf="start" data-c="${c.id}"></div>` : ''}
    ${ti ? `<div class="bar ${ti.under > 0 ? 'warn' : ''}"><i style="width:${Math.round(ti.pct * 100)}%"></i></div><div class="small"><strong>${esc(ti.label)}</strong>${ti.need ? ' · besoin ce mois-ci : ' + fmt(ti.need) : ''}</div>
      <button class="btn sm" data-a="tSnooze" data-c="${c.id}">${ti.snoozed ? 'Réactiver ce mois-ci' : 'Mettre en pause ce mois-ci'}</button>` : ''}
  </div>`;
}

/* ---------- RTA breakdown ---------- */
function rtaSheet() {
  const m = A.month, md = monthData(m);
  const prevLeft = md.rtaBase - md.income + md.assigned + md.prevCashOver;
  const body = `<div class="card">
    <div class="li"><span class="grow">Reste de ${monthLabel(addMonths(m, -1))}</span><strong class="num">${fmt(prevLeft)}</strong></div>
    <div class="li"><span class="grow">Revenus de ${monthLabel(m)}</span><strong class="num amt-pos">+${fmt(md.income)}</strong></div>
    <div class="li"><span class="grow">Dépassement de ${monthLabel(addMonths(m, -1))}</span><strong class="num">${fmt(-md.prevCashOver)}</strong></div>
    <div class="li"><span class="grow">Réparti en ${monthLabel(m)}</span><strong class="num">${fmt(-md.assigned)}</strong></div>
    <div class="li"><span class="grow">Réparti sur les mois suivants</span><strong class="num">${fmt(-md.future)}</strong></div>
    <div class="li"><strong class="grow">À répartir</strong><strong class="num">${fmt(md.rta)}</strong></div></div>
    ${md.uncat ? `<div class="banner warn">${I.info}<span>${fmt(md.uncat)} d'opérations sans catégorie comptent ici.</span></div>` : ''}
    <div class="grid2"><div class="kpi"><span>Total disponible</span><b class="num">${fmt(md.available)}</b></div><div class="kpi"><span>Activité du mois</span><b class="num">${fmt(md.activity)}</b></div></div>
    <div class="field"><label for="mNote">Note du mois</label><textarea id="mNote" class="in" data-mnote="${m}" placeholder="Ex. : prime reçue, voyage à prévoir…">${esc(A.plan.notes?.[m] || '')}</textarea></div>
    <button class="btn pri block" data-a="assignSheet">${I.wand} Répartition automatique</button>`;
  openSheet('À répartir — ' + monthLabel(m), body);
}

/* ---------- auto-assign ---------- */
function autoOptions(m, cats) {
  const prev = addMonths(m, -1);
  const opts = {
    under: { l: 'Objectifs sous-financés', f: c => { const ti = targetInfo(c, m); return ti ? getAssigned(m, c.id) + ti.under : null; } },
    lastA: { l: 'Réparti le mois dernier', f: c => catM(prev, c.id).assigned },
    lastS: { l: 'Dépensé le mois dernier', f: c => Math.max(0, -catM(prev, c.id).activity) },
    avgA: { l: 'Moyenne répartie (12 mois max)', f: c => { const n = Math.max(1, Math.min(12, monthDiff(calc().minM, m))); let s = 0; for (let i = 1; i <= n; i++) s += catM(addMonths(m, -i), c.id).assigned; return Math.round(s / n); } },
    avgS: { l: 'Moyenne dépensée (12 mois max)', f: c => { const n = Math.max(1, Math.min(12, monthDiff(calc().minM, m))); let s = 0; for (let i = 1; i <= n; i++) s += Math.max(0, -catM(addMonths(m, -i), c.id).activity); return Math.round(s / n); } },
    resetAv: { l: 'Remettre le disponible à zéro', f: c => { const x = catM(m, c.id); return x.available > 0 ? getAssigned(m, c.id) - x.available : null; } },
    resetAs: { l: 'Remettre le réparti à zéro', f: () => 0 },
  };
  const out = [];
  for (const [k, o] of Object.entries(opts)) {
    let delta = 0; const changes = [];
    for (const c of cats) { const v = o.f(c); if (v == null) continue; const cur = getAssigned(m, c.id); if (v !== cur) { delta += v - cur; changes.push([c.id, v]); } }
    out.push({ k, l: o.l, delta, changes });
  }
  return out;
}
function assignSheet() {
  const m = A.month; const cats = A.plan.cats.filter(c => !c.hidden);
  const opts = autoOptions(m, cats);
  const body = `<div class="small muted">S'applique à toutes les enveloppes visibles de ${monthLabel(m)}. Tu peux annuler juste après.</div>
    <div class="card">${opts.map(o => `<button class="li" data-a="autoApply" data-k="${o.k}" ${o.changes.length ? '' : 'disabled'}><span class="grow"><strong>${o.l}</strong><div class="small muted">${o.changes.length} enveloppe${o.changes.length > 1 ? 's' : ''}</div></span><strong class="num ${o.delta > 0 ? '' : 'amt-pos'}">${o.delta > 0 ? '' : '+'}${fmt(-o.delta)}</strong></button>`).join('')}</div>
    <div class="small muted">Le montant affiché est l'effet sur « À répartir » (${fmt(monthData(m).rta)} actuellement).</div>`;
  openSheet('Répartition automatique', body);
}

/* ---------- move money / cover ---------- */
function moveSheet(fromCid, toCid, amount, title) {
  const m = A.month;
  const opts = sel => `<option value="rta" ${sel === 'rta' ? 'selected' : ''}>À répartir (${fmt(monthData(m).rta)})</option>` + A.plan.groups.map(g => {
    const cs = A.plan.cats.filter(c => c.gid === g.id && !c.hidden); if (!cs.length) return '';
    return `<optgroup label="${esc(g.name)}">${cs.map(c => `<option value="${c.id}" ${sel === c.id ? 'selected' : ''}>${esc(catName(c.id))} · ${fmt(catM(m, c.id).available)}</option>`).join('')}</optgroup>`;
  }).join('');
  const body = `<input id="mvAmt" class="bigamt in-amt" inputmode="decimal" value="${amount ? fmtIn(amount) : ''}" placeholder="0,00" aria-label="Montant">
    <div class="field"><label for="mvFrom">Depuis</label><select id="mvFrom" class="in">${opts(fromCid || 'rta')}</select></div>
    <div class="field"><label for="mvTo">Vers</label><select id="mvTo" class="in">${opts(toCid || 'rta')}</select></div>`;
  openSheet(title || 'Déplacer de l\'argent', body, `<button class="btn pri block" data-a="moveDo">Déplacer</button>`, { focus: '#mvAmt' });
}
function coverSheet(cid) {
  const m = A.month, need = -catM(m, cid).available;
  const best = A.plan.cats.filter(c => c.id !== cid && !c.hidden && catM(m, c.id).available >= need).sort((a, b) => catM(m, b.id).available - catM(m, a.id).available)[0];
  moveSheet(monthData(m).rta >= need ? 'rta' : (best?.id || 'rta'), cid, need, 'Couvrir le dépassement');
}
function movesSheet() {
  const m = A.month; const list = A.plan.moves.filter(x => x.m === m).sort((a, b) => b.at - a.at);
  const nm = id => id === 'rta' ? 'À répartir' : catName(id) || 'Enveloppe supprimée';
  const body = list.length ? `<div class="card">${list.map(x => `<div class="li"><span class="ic">${I.swap}</span><span class="grow"><strong class="ellip" style="display:block">${esc(nm(x.from))} → ${esc(nm(x.to))}</strong><span class="small muted">${new Date(x.at).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}${x.why ? ' · ' + esc(x.why) : ''}</span></span><strong class="num">${fmt(x.amount)}</strong></div>`).join('')}</div>`
    : `<div class="empty"><strong>Aucun mouvement en ${monthLabel(m)}</strong><span>Les déplacements entre enveloppes apparaîtront ici.</span></div>`;
  openSheet('Mouvements — ' + monthLabel(m), body, `<button class="btn block" data-a="moveSheet">${I.swap} Déplacer de l'argent</button>`);
}

/* ---------- transaction editor ---------- */
let D = null;
function txSheet(id, preset = {}) {
  if (id) {
    const t = A.tx.find(x => x.id === id); if (!t) return;
    D = { id: t.id, acct: t.acct, date: t.date, payee: L.payee[t.payee]?.name || '', cat: t.cat || '', memo: t.memo || '', amount: Math.abs(t.amount), kind: t.transferAcct ? 'transfer' : t.amount > 0 ? 'in' : 'out', cleared: t.cleared, flag: t.flag, transferAcct: t.transferAcct || '', approved: t.approved !== false, splits: t.splits ? t.splits.map(s => ({ ...s, amount: Math.abs(s.amount), sign: Math.sign(s.amount) || -1 })) : null, freq: 'never' };
    if (t.transferAcct && t.amount > 0) { // show transfer from the outgoing side
      const pair = A.tx.find(x => x.id === t.transferId);
      if (pair) { D.id = pair.id; D.acct = pair.acct; D.transferAcct = pair.transferAcct; D.cat = pair.cat || t.cat || ''; D.pairCat = t.cat || ''; }
    }
  } else {
    const last = A.ui.lastAcct && L.acct[A.ui.lastAcct] && !L.acct[A.ui.lastAcct].closed ? A.ui.lastAcct : A.plan.accounts.find(a => !a.closed && onBudget(a))?.id || A.plan.accounts.find(a => !a.closed)?.id;
    D = { acct: (A.acct && A.acct !== 'all') ? A.acct : last, date: todayISO(), payee: '', cat: '', memo: '', amount: 0, kind: 'out', cleared: 'u', flag: null, transferAcct: '', approved: true, splits: null, freq: 'never', ...preset };
  }
  openSheet(id ? 'Modifier l\'opération' : 'Nouvelle opération', txBody(), txFoot(), { focus: id ? null : '#txAmt' });
}
function txBody() {
  const a = L.acct[D.acct];
  const tb = D.transferAcct ? L.acct[D.transferAcct] : null;
  const needCat = D.kind === 'transfer' ? (onBudget(a) && tb && !onBudget(tb)) : onBudget(a);
  const payees = A.plan.payees.slice().sort((x, y) => x.name.localeCompare(y.name)).map(y => `<option value="${esc(y.name)}"></option>`).join('');
  let splitHtml = '';
  if (D.splits) {
    const sum = D.splits.reduce((s, x) => s + x.amount, 0);
    splitHtml = `<div class="sec-t" style="padding-top:0"><span>Fractionnement</span><span class="num" id="spStatus" style="color:${sum === D.amount ? 'var(--good)' : 'var(--warn)'}">${sum === D.amount ? 'Équilibré' : 'Reste ' + fmt(D.amount - sum)}</span></div>
      ${D.splits.map((s, i) => `<div class="split"><select class="in" data-sp="cat" data-i="${i}" aria-label="Catégorie ${i + 1}">${catOptions(s.cat, { m: monthOf(D.date) })}</select>
        <input class="in num" inputmode="decimal" data-sp="amount" data-i="${i}" value="${s.amount ? fmtIn(s.amount) : ''}" placeholder="0,00" aria-label="Montant ${i + 1}">
        <button class="ibtn" data-a="spDel" data-i="${i}" aria-label="Retirer">${I.close}</button>
        <input class="in" style="grid-column:1/-1; height:40px; font-size:14px" data-sp="memo" data-i="${i}" value="${esc(s.memo || '')}" placeholder="Mémo (facultatif)" aria-label="Mémo ${i + 1}"></div>`).join('')}
      <div class="row"><button class="btn sm" data-a="spAdd">${I.plus} Ligne</button>${sum !== D.amount ? `<button class="btn sm" data-a="spFill">Mettre le reste sur la dernière ligne</button>` : ''}<button class="btn sm ghost" data-a="spOff">Annuler le fractionnement</button></div>`;
  }
  return `<div class="seg" role="group" aria-label="Type">
      <button class="${D.kind === 'out' ? 'on' : ''}" data-a="kind" data-v="out">Dépense</button>
      <button class="${D.kind === 'in' ? 'on' : ''}" data-a="kind" data-v="in">Revenu</button>
      <button class="${D.kind === 'transfer' ? 'on' : ''}" data-a="kind" data-v="transfer">Virement</button></div>
    <input id="txAmt" class="bigamt ${D.kind === 'in' ? 'in' : 'out'}" inputmode="decimal" value="${D.amount ? fmtIn(D.amount) : ''}" placeholder="0,00" data-d="amount" aria-label="Montant">
    ${D.approved === false ? `<div class="banner info">${I.info}<span>Opération importée : vérifie la catégorie puis valide.</span></div>` : ''}
    <div class="field"><label for="txAcct">${D.kind === 'transfer' ? 'Depuis le compte' : 'Compte'}</label><select id="txAcct" class="in" data-d="acct">${acctOptions(D.acct)}</select></div>
    ${D.kind === 'transfer' ? `<div class="field"><label for="txTo">Vers le compte</label><select id="txTo" class="in" data-d="transferAcct"><option value="">Choisir…</option>${acctOptions(D.transferAcct, x => x.id !== D.acct)}</select></div>`
      : `<div class="field"><label for="txPayee">Bénéficiaire</label><input id="txPayee" class="in" list="payeeList" value="${esc(D.payee)}" data-d="payee" placeholder="Ex. : Lidl, Salaire…" autocomplete="off"><datalist id="payeeList">${payees}</datalist></div>`}
    ${needCat && !D.splits ? `<div class="field"><label for="txCat">Catégorie</label><div class="row"><select id="txCat" class="in grow" data-d="cat">${catOptions(D.cat, { m: monthOf(D.date || todayISO()), rta: D.kind !== 'transfer' })}</select>${D.kind !== 'transfer' ? `<button class="ibtn" data-a="spOn" aria-label="Fractionner">${I.split}</button>` : ''}</div></div>` : ''}
    ${D.kind === 'transfer' && tb && onBudget(a) && onBudget(tb) ? `<div class="small muted">Virement entre deux comptes du budget : aucune catégorie nécessaire.${isCredit(tb) ? ' Ce paiement réduit l\'enveloppe de paiement de la carte.' : ''}</div>` : ''}
    ${splitHtml}
    <div class="grid2"><div class="field"><label for="txDate">Date</label><input id="txDate" class="in" type="date" value="${D.date}" data-d="date"></div>
      <div class="field"><label for="txFreq">Répéter</label><select id="txFreq" class="in" data-d="freq" ${D.id ? 'disabled' : ''}>${Object.entries(FREQ).map(([k, l]) => `<option value="${k}" ${D.freq === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div></div>
    <div class="field"><label for="txMemo">Mémo</label><input id="txMemo" class="in" value="${esc(D.memo)}" data-d="memo" placeholder="Facultatif"></div>
    <div class="field"><span class="lbl2">Drapeau</span><div class="flags"><button class="${!D.flag ? 'on' : ''}" style="background:var(--surface-2)" data-a="dFlag" data-v="" aria-label="Aucun drapeau"></button>${FLAGS.map(([k, l]) => `<button class="${D.flag === k ? 'on' : ''}" style="background:var(--flag-${k})" data-a="dFlag" data-v="${k}" aria-label="${l}"></button>`).join('')}</div></div>
    <label class="switch"><span><strong>Pointée</strong><div class="small muted">Apparue sur le relevé de la banque</div></span><input type="checkbox" id="txClr" data-d="cleared" ${D.cleared !== 'u' ? 'checked' : ''} ${D.cleared === 'r' ? 'disabled' : ''}></label>

let IMP = null;

function decodeFile(buf) {
  let txt = new TextDecoder('utf-8').decode(buf);
  if (txt.includes('\uFFFD')) txt = new TextDecoder('windows-1252').decode(buf);
  return txt.replace(/^﻿/, '');
}
function parseCSV(txt) {
  const first = txt.split(/\r?\n/).find(l => l.trim()) || '';
  const cands = [';', ',', '\t', '|']; const delim = cands.sort((a, b) => first.split(b).length - first.split(a).length)[0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < txt.length; i++) {
    const ch = txt[i];
    if (q) { if (ch === '"') { if (txt[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cell.trim()); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && txt[i + 1] === '\n') i++; row.push(cell.trim()); if (row.some(c => c)) rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  row.push(cell.trim()); if (row.some(c => c)) rows.push(row);
  return rows;
}
function parseDateAny(s, fmtHint) {
  s = (s || '').trim().slice(0, 10);
  let m;
  if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  if ((m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/))) {
    let y = +m[3]; if (y < 100) y += 2000;
    const [d, mo] = fmtHint === 'mdy' ? [+m[2], +m[1]] : [+m[1], +m[2]];
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    return `${y}-${pad(mo)}-${pad(d)}`;
  }
  if ((m = s.match(/^(\d{4})(\d{2})(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}
function parseMoney(s) {
  s = String(s || '').replace(/[\s €$£]/g, '').replace(/−/g, '-');
  if (!s) return null;
  let neg = false; if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (s.endsWith('-')) { neg = true; s = s.slice(0, -1); }
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc > ld) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/,/g, '');
  const v = parseFloat(s); if (isNaN(v)) return null;
  return Math.round((neg ? -v : v) * 100);
}
function guessMap(head) {
  const h = head.map(x => x.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''));
  const find = (...keys) => h.findIndex(x => keys.some(k => x.includes(k)));
  return {
    date: find('date op', 'date de l', 'date', 'jour', 'booking'),
    payee: find('libelle', 'beneficiaire', 'description', 'payee', 'tiers', 'nom', 'label', 'intitule'),
    memo: find('memo', 'detail', 'note', 'commentaire', 'information', 'reference'),
    amount: find('montant', 'amount', 'somme', 'valeur'),
    out: find('debit', 'sortie', 'outflow', 'retrait'),
    in: find('credit', 'entree', 'inflow', 'versement'),
  };
}
async function onImportFile(file) {
  const buf = await file.arrayBuffer(); const txt = decodeFile(buf);
  IMP.acct = $('#impAcct').value;
  const name = file.name.toLowerCase();
  if (/\.(ofx|qfx)$/.test(name) || /<OFX>/i.test(txt)) { IMP.rows = parseOFX(txt); return impPreview(); }
  if (/\.qif$/.test(name) || /^!Type:/m.test(txt)) { IMP.rows = parseQIF(txt); return impPreview(); }
  const rows = parseCSV(txt);
  if (rows.length < 2) { $('#impStep').innerHTML = `<div class="banner bad">${I.info}<span>Fichier vide ou illisible.</span></div>`; return; }
  let hi = rows.findIndex(r => r.length >= 3 && r.some(c => /date/i.test(c))); if (hi < 0) hi = 0;
  IMP.csv = { head: rows[hi], body: rows.slice(hi + 1) };
  IMP.map = guessMap(rows[hi]);
  IMP.map.dfmt = 'dmy'; IMP.map.invert = false;
  impMapping();
}
function impMapping() {
  const { head, body } = IMP.csv, mp = IMP.map;
  const opts = (k, opt) => `<option value="-1">${opt ? '— aucune —' : 'Choisir…'}</option>` + head.map((h, i) => `<option value="${i}" ${mp[k] === i ? 'selected' : ''}>${esc(h || 'Colonne ' + (i + 1))}</option>`).join('');
  const sample = body.slice(0, 3).map(r => `<tr>${head.map((_, i) => `<td>${esc(r[i] || '')}</td>`).join('')}</tr>`).join('');
  $('#impStep').innerHTML = `<div class="sec-t"><span>Colonnes du fichier</span></div>
    <div style="overflow-x:auto" class="card"><table class="tbl"><thead><tr>${head.map(h => `<th style="text-align:left">${esc(h)}</th>`).join('')}</tr></thead><tbody>${sample}</tbody></table></div>
    <div class="grid2">

function confirmSheet(title, text, btn, act, data = {}) {
  const attrs = Object.entries(data).map(([k, v]) => `data-${k}="${esc(v)}"`).join(' ');
  openSheet(title, `<p style="margin:0">${text}</p>`, `<button class="btn block" data-a="closeSheet">Annuler</button><button class="btn danger block" data-a="${act}" ${attrs}>${btn}</button>`);
}
async function saveFile(filename, data, mime) {
  try { const dl = await window.claude?.use?.('downloads'); if (dl) { await dl.save({ filename, data }); toast('Fichier prêt : ' + filename); return; } } catch (e) { if (e?.code === 'declined') return; }
  try { const url = URL.createObjectURL(new Blob([data], { type: mime })); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); }
  catch (e) { toast('Export impossible ici'); }
}
function exportJson() { saveFile(`budget-${A.plan.name.replace(/[^\w-]+/g, '_')}-${todayISO()}.json`, JSON.stringify({ app: 'pecule', v: 1, plan: A.plan, tx: A.tx }, null, 1), 'application/json'); }
function exportCsv() {
  const q = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
  const rows = [['Compte', 'Date', 'Bénéficiaire', 'Catégorie', 'Mémo', 'Sortie', 'Entrée', 'Pointée'].map(q).join(';')];
  for (const t of A.tx.slice().sort((a, b) => a.date < b.date ? -1 : 1)) for (const ln of txLines(t)) rows.push([L.acct[t.acct]?.name, fmtDate(t.date), payeeName(t), ln.cat === '__start' ? 'Solde initial' : catName(ln.cat), ln.memo || t.memo, ln.amount < 0 ? fmtIn(-ln.amount) : '', ln.amount > 0 ? fmtIn(ln.amount) : '', t.cleared === 'u' ? 'non' : t.cleared === 'r' ? 'rapprochée' : 'oui'].map(q).join(';'));
  saveFile(`budget-operations-${todayISO()}.csv`, '﻿' + rows.join('\r\n'), 'text/csv');
}
async function restoreFile(file) {
  try {
    const d = JSON.parse(decodeFile(await file.arrayBuffer()));
    if (d.app !== 'pecule' || !d.plan) throw 0;
    const plan = d.plan; const exists = A.index.plans.some(x => x.id === plan.id);
    if (exists) { plan.id = uid(); plan.name += ' (restauré)'; }
    if (A.plan) { localSaveAll(); }
    A.plan = plan; A.tx = d.tx || []; A.index.plans.push({ id: plan.id, name: plan.name }); A.index.current = plan.id;
    A.undo = []; A.redo = []; rebuildLookups(); scheduleSave(); watchCore(); A.view = 'plan'; render(); toast('Sauvegarde restaurée');
  } catch (e) { toast('Ce fichier n\'est pas une sauvegarde de l'appli'); }
}
function createPlan(name, demo) {
  if (A.plan) localSaveAll();
  const p = defaultPlan(name);
  A.plan = p; A.tx = []; A.index.plans.push({ id: p.id, name: p.name }); A.index.current = p.id; A.undo = []; A.redo = [];
  rebuildLookups(); if (demo) buildDemo(); scheduleSave(); watchCore(); A.view = 'plan'; A.month = curMonth(); render();
}
function freshStart() {
  const old = A.plan, b = balances();
  localSaveAll();
  const oldEnt = A.index.plans.find(x => x.id === old.id); if (oldEnt) oldEnt.name = old.name + ' (archive ' + fmtDate(todayISO()) + ')';
  const archived = { ...old, name: oldEnt?.name || old.name };
  if (DB) { DB.doc('plans/' + old.id).set(JSON.parse(JSON.stringify(archived))).catch(() => { }); }
  try { const all = localLoad(); if (all?.plans?.[old.id]) { all.plans[old.id].plan = archived; localStorage.setItem(LKEY, JSON.stringify(all)); } } catch (e) { }
  const p = JSON.parse(JSON.stringify(old)); p.id = uid(); p.assigned = {}; p.moves = []; p.notes = {}; p.startMonth = curMonth(); p.createdAt = Date.now();
  const idMap = {}; p.accounts = p.accounts.filter(a => !a.closed).map(a => { const n = { ...a, id: uid(), lastRec: null }; idMap[a.id] = n.id; return n; });
  p.cats = p.cats.filter(c => !c.cc || idMap[c.cc]).map(c => c.cc ? { ...c, cc: idMap[c.cc] } : c);
  p.scheduled = p.scheduled.filter(s => idMap[s.acct]).map(s => ({ ...s, acct: idMap[s.acct], transferAcct: s.transferAcct ? idMap[s.transferAcct] || null : null }));
  A.plan = p; A.tx = []; rebuildLookups();
  for (const a of old.accounts) if (idMap[a.id] && b[a.id].working) {
    const na = L.acct[idMap[a.id]];
    A.tx.push({ id: uid(), acct: na.id, date: todayISO(), payee: getPayee('Solde initial').id, cat: onBudget(na) && !isCredit(na) ? 'rta' : '__start', memo: '', amount: b[a.id].working, cleared: 'r', flag: null, approved: true });
  }
  A.index.plans.push({ id: p.id, name: p.name }); A.index.current = p.id; A.undo = []; A.redo = [];
  scheduleSave(); watchCore(); A.month = curMonth(); A.view = 'plan'; render(); toast('Nouveau départ : ancien budget archivé');
}

      [4, 'Tisséo', 'Transport', -1020], [12, 'SNCF', 'Transport', -3450], [9, 'Le Bar Basque', 'Restaurants & sorties', -2300], [20, 'Pizzeria', 'Restaurants & sorties', -3150], [14, 'Pharmacie', 'Santé', -1890], [15, 'Netflix', 'Abonnements', -1349], [15, 'Spotify', 'Abonnements', -1199], [21, 'Cinéma', 'Loisirs', -2400], [11, 'MAIF', 'Assurances', -3500]];
    for (const [d, py, ct, v] of list) if (d <= lim) add(chk.id, day(m, d), py, ct, v);

  acctClose: el => { const a = L.acct[el.dataset.id]; if (!a.closed && balances()[a.id].working !== 0) { toast('Le solde doit être à 0 pour clôturer'); return; } mutate(a.closed ? 'Compte rouvert' : 'Compte clôturé', () => { a.closed = !a.closed; }); closeSheet(); },
  acctDelete: el => confirmSheet('Supprimer le compte', 'Toutes ses opérations seront supprimées. Tu pourras annuler juste après.', 'Supprimer', 'acctDeleteDo', { id: el.dataset.id }),
  acctDeleteDo: el => { const id = el.dataset.id; mutate('Compte supprimé', () => { deleteTx(A.tx.filter(t => t.acct === id).map(t => t.id)); A.plan.accounts = A.plan.accounts.filter(a => a.id !== id); A.plan.cats = A.plan.cats.filter(c => c.cc !== id); A.plan.scheduled = A.plan.scheduled.filter(s => s.acct !== id && s.transferAcct !== id); }); closeSheet(); A.acct = null; render(); },
  openAcct: el => { A.acct = el.dataset.id; A.ui.regFilter = 'all'; A.ui.search = ''; A.ui.regLimit = 150; window.scrollTo(0, 0); render(); },
  openAll: el => { A.view = 'tx'; A.acct = 'all'; A.ui.regFilter = el.dataset.f; A.ui.search = ''; window.scrollTo(0, 0); render(); },
  backAccts: () => { A.acct = null; A.ui.select = false; A.ui.selected.clear(); render(); },
  regFilter: el => { A.ui.regFilter = el.dataset.f; render(); },
  more: () => { A.ui.regLimit = (A.ui.regLimit || 150) + 300; render._keepScroll = true; render(); },
  toggleSelect: () => { A.ui.select = !A.ui.select; A.ui.selected.clear(); render._keepScroll = true; render(); },
  clr: el => { const t = A.tx.find(x => x.id === el.dataset.id); if (!t || t.cleared === 'r') { if (t) toast('Opération rapprochée : modifie-la pour la déverrouiller'); return; } render._keepScroll = true; mutate(t.cleared === 'u' ? 'Pointée' : 'Dépointée', () => { t.cleared = t.cleared === 'u' ? 'c' : 'u'; }, { silent: true }); },
  approve: el => { const t = A.tx.find(x => x.id === el.dataset.id); if (!t) return; if (!t.cat && !t.splits && onBudget(L.acct[t.acct]) && !t.transferAcct) { txSheet(t.id); return; } render._keepScroll = true; mutate('Opération validée', () => { t.approved = true; }, { silent: true }); },
  newTx: () => { closeSheet(); txSheet(null); },
  txEdit: el => txSheet(el.dataset.id),
  kind: el => { D.kind = el.dataset.v; if (D.kind === 'transfer') { D.splits = null; } else D.transferAcct = ''; if (D.kind === 'in' && !D.cat) D.cat = 'rta'; if (D.kind === 'out' && D.cat === 'rta') D.cat = ''; txRefresh(); },
  dFlag: el => { D.flag = el.dataset.v || null; txRefresh(); },
  spOn: () => { D.splits = [{ cat: D.cat || '', amount: D.amount, memo: '' }, { cat: '', amount: 0, memo: '' }]; txRefresh(); },
  spOff: () => { D.cat = D.splits?.[0]?.cat || ''; D.splits = null; txRefresh(); },
  spAdd: () => { D.splits.push({ cat: '', amount: 0, memo: '' }); txRefresh(); },
  spDel: el => { D.splits.splice(+el.dataset.i, 1); if (D.splits.length < 2) { D.cat = D.splits[0]?.cat || ''; D.splits = null; } txRefresh(); },
  spFill: () => { const s = D.splits; const rest = D.amount - s.slice(0, -1).reduce((x, y) => x + y.amount, 0); s[s.length - 1].amount = Math.max(0, rest); txRefresh(); },
  txSave: () => txCommit(false), txSaveNew: () => txCommit(true),
  txDelete: () => { const id = D.id; mutate('Opération supprimée', () => deleteTx([id])); closeSheet(); },
  bulk: el => {
    const k = el.dataset.k, ids = [...A.ui.selected]; const ts = A.tx.filter(t => A.ui.selected.has(t.id));
    if (k === 'none') { A.ui.selected.clear(); render(); return; }
    if (k === 'approve') mutate(`${ids.length} validées`, () => ts.forEach(t => t.approved = true));
    else if (k === 'clear') mutate(`${ids.length} pointées`, () => ts.forEach(t => { if (t.cleared === 'u') t.cleared = 'c'; }));
    else if (k === 'del') { mutate(`${ids.length} supprimées`, () => deleteTx(ids)); A.ui.selected.clear(); }
    else if (k === 'cat') openSheet('Catégoriser ' + ids.length + ' opérations', `<div class="field"><label for="bkCat">Catégorie</label><select id="bkCat" class="in">${catOptions('')}</select></div><label class="switch"><span>Valider en même temps</span><input type="checkbox" id="bkAp" checked></label>`, `<button class="btn pri block" data-a="bulkCatDo">Appliquer</button>`);
    else if (k === 'flag') openSheet('Drapeau', `<div class="flags"><button style="background:var(--surface-2)" data-a="bulkFlagDo" data-v="" aria-label="Aucun"></button>${FLAGS.map(([f, l]) => `<button style="background:var(--flag-${f})" data-a="bulkFlagDo" data-v="${f}" aria-label="${l}"></button>`).join('')}</div>`);
    else if (k === 'date') openSheet('Changer la date', `<input type="date" id="bkDate" class="in" value="${todayISO()}">`, `<button class="btn pri block" data-a="bulkDateDo">Appliquer</button>`);
  },
  bulkCatDo: () => { const c = $('#bkCat').value || null, ap = $('#bkAp').checked; const ts = A.tx.filter(t => A.ui.selected.has(t.id) && !t.transferAcct); mutate(`${ts.length} catégorisées`, () => ts.forEach(t => { t.cat = c; t.splits = null; if (ap) t.approved = true; const y = L.payee[t.payee]; if (y && c) y.lastCat = c; })); closeSheet(); },
  bulkFlagDo: el => { const ts = A.tx.filter(t => A.ui.selected.has(t.id)); mutate('Drapeaux modifiés', () => ts.forEach(t => t.flag = el.dataset.v || null)); closeSheet(); },
  bulkDateDo: () => { const d = $('#bkDate').value; if (!d) return; const ts = A.tx.filter(t => A.ui.selected.has(t.id)); mutate('Dates modifiées', () => ts.forEach(t => { t.date = d; const p = t.transferId && A.tx.find(x => x.id === t.transferId); if (p) p.date = d; })); closeSheet(); },
  reconcile: el => reconcileSheet(el.dataset.id, 1),
  recYes: el => { const id = el.dataset.id; mutate('Compte rapproché', () => { A.tx.forEach(t => { if (t.acct === id && t.cleared === 'c') t.cleared = 'r'; }); L.acct[id].lastRec = todayISO(); }); closeSheet(); },
  recNo: el => reconcileSheet(el.dataset.id, 2),
  recAdjust: el => {
    const id = el.dataset.id; const v = evalExpr($('#recBal').value); if (v == null) return toast('Indique le solde de la banque');
    const diff = v - balances()[id].cleared; const a = L.acct[id];
    mutate(diff ? 'Ajustement de ' + fmt(diff) + ' et rapprochement' : 'Compte rapproché', () => {
      if (diff) A.tx.push({ id: uid(), acct: id, date: todayISO(), payee: getPayee('Ajustement de rapprochement').id, cat: onBudget(a) && !isCredit(a) ? 'rta' : '__start', memo: '', amount: diff, cleared: 'c', flag: null, approved: true });
      A.tx.forEach(t => { if (t.acct === id && t.cleared === 'c') t.cleared = 'r'; }); a.lastRec = todayISO();
    }); closeSheet();
  },
  loanPlanner: el => loanSheet(el.dataset.id, 0),
  loanTarget: el => {
    const a = L.acct[el.dataset.id], amt = (a.minPay || 0) + (+el.dataset.x || 0); if (!amt) return toast('Indique d\'abord la mensualité');
    mutate('Enveloppe de remboursement prête', () => {
      let g = A.plan.groups.find(x => x.name === 'Dettes' && !x.sys); if (!g) { g = { id: uid(), name: 'Dettes' }; A.plan.groups.push(g); }
      let c = A.plan.cats.find(x => x.loan === a.id); if (!c) { c = { id: uid(), gid: g.id, name: 'Remboursement ' + a.name, note: '', loan: a.id }; A.plan.cats.push(c); }
      c.target = { type: 'debt', amount: amt };
      const from = A.plan.accounts.find(x => onBudget(x) && !isCredit(x) && !x.closed);
      if (from && !A.plan.scheduled.some(s => s.transferAcct === a.id)) A.plan.scheduled.push({ id: uid(), acct: from.id, transferAcct: a.id, payee: '', cat: c.id, memo: 'Mensualité', amount: -amt, freq: 'monthly', next: addMonths(curMonth(), 1) + '-05' });
    }); closeSheet();
  },
  loanInterest: el => { const a = L.acct[el.dataset.id]; const i = Math.round(-(balances()[a.id].working) * (a.rate || 0) / 100 / 12); if (!i) return toast('Pas d\'intérêts à ajouter'); mutate('Intérêts ajoutés', () => { A.tx.push({ id: uid(), acct: a.id, date: todayISO(), payee: getPayee('Intérêts').id, cat: '__start', memo: '', amount: -i, cleared: 'c', flag: null, approved: true }); }); loanSheet(a.id, +($('#lxRange')?.value || 0)); },
  ccPay: el => ccPaySheet(el.dataset.id),
  importSheet: el => importSheet(el.dataset.id || (A.acct && A.acct !== 'all' ? A.acct : null)),
  impBuild: () => impBuildCSV(), impDo: () => impDo(),
  schEdit: el => schSheet(el.dataset.id), schList: () => schListSheet(),
  schNow: el => { const s = A.plan.scheduled.find(x => x.id === el.dataset.id); mutate('Opération saisie', () => { saveTx({ acct: s.acct, date: todayISO(), payee: s.payee, cat: s.cat, memo: s.memo, amount: s.amount, transferAcct: s.transferAcct, splits: s.splits, cleared: 'u', approved: true }); s.next = s.freq === 'never' ? null : nextDate(s.next, s.freq); A.plan.scheduled = A.plan.scheduled.filter(x => x.next); }); },
  schSkip: el => { const s = A.plan.scheduled.find(x => x.id === el.dataset.id); mutate('Prochaine échéance sautée', () => { s.next = s.freq === 'never' ? null : nextDate(s.next, s.freq); A.plan.scheduled = A.plan.scheduled.filter(x => x.next); }); closeSheet(); },
  schDel: el => { mutate('Programmation supprimée', () => { A.plan.scheduled = A.plan.scheduled.filter(x => x.id !== el.dataset.id); }); closeSheet(); },
  schSave: el => { const s = A.plan.scheduled.find(x => x.id === el.dataset.id); const amt = evalExpr($('#sAmt').value); if (amt == null) return toast('Montant invalide'); mutate('Programmation modifiée', () => { s.amount = amt; s.acct = $('#sAcct').value; s.next = $('#sNext').value; s.freq = $('#sFreq').value; s.memo = $('#sMemo').value; if ($('#sPayee')) { s.payee = $('#sPayee').value; s.cat = $('#sCat').value || null; } runScheduled(); }); closeSheet(); },
  payees: () => payeesSheet(),
  pyDel: el => { mutate('Bénéficiaire supprimé', () => { A.plan.payees = A.plan.payees.filter(y => y.id !== el.dataset.id); }, { silent: true }); payeesSheet(); },
  ruleAdd: () => { const c = $('#ruleC').value.trim(), p = $('#ruleP').value.trim(); if (!c || !p) return toast('Remplis les deux champs'); mutate('Règle ajoutée', () => A.plan.rules.push({ contains: c, payee: p }), { silent: true }); payeesSheet(); },
  ruleDel: el => { mutate('Règle supprimée', () => A.plan.rules.splice(+el.dataset.i, 1), { silent: true }); payeesSheet(); },
  // reflect
  reflectTab: el => { A.ui.reflect = el.dataset.k; render(); }, period: el => { A.ui.period = el.dataset.k; render(); }, groupBy: el => { A.ui.groupBy = el.dataset.k; render(); },
  // settings
  switchPlan: el => { if (el.dataset.id !== A.plan.id) { localSaveAll(); switchPlan(el.dataset.id); } },
  newPlan: () => openSheet('Nouveau budget', `<div class="field"><label for="npName">Nom</label><input id="npName" class="in" value="Nouveau budget"></div>`, `<button class="btn pri block" data-a="newPlanDo">Créer</button>`, { focus: '#npName' }),
  newPlanDo: () => { const n = $('#npName').value.trim() || 'Nouveau budget'; closeSheet(); createPlan(n); },
  createPlan: () => createPlan($('#obName')?.value.trim() || 'Mon budget'),
  demoPlan: () => createPlan('Exemple', true),
  exportJson: () => exportJson(), exportCsv: () => exportCsv(),
  freshStart: () => confirmSheet('Nouveau départ', 'Le budget actuel est archivé (toujours consultable dans « Mes budgets »). Un nouveau budget reprend tes comptes avec leur solde du jour, tes enveloppes et tes objectifs.', 'Repartir de zéro', 'freshDo'),
  freshDo: () => { closeSheet(); freshStart(); },
  resetPlan: () => confirmSheet('Remettre la répartition à zéro', 'Tout l\'argent réparti, sur tous les mois, sera effacé. Tes comptes et opérations restent.', 'Remettre à zéro', 'resetDo'),
  resetDo: () => { mutate('Répartition remise à zéro', () => { A.plan.assigned = {}; A.plan.moves = []; }); closeSheet(); },
  deletePlan: () => confirmSheet('Supprimer ce budget', `« ${esc(A.plan.name)} » et toutes ses opérations seront supprimés définitivement. Exporte une sauvegarde avant si tu as un doute.`, 'Supprimer définitivement', 'deletePlanDo'),
  deletePlanDo: async () => {
    const id = A.plan.id; closeSheet();
    if (DB) { try { await DB.doc('plans/' + id).delete(); const snap = await DB.collection('plans/' + id + '/tx').get(); for (const d of snap.docs) await DB.doc('plans/' + id + '/tx/' + d.id).delete(); } catch (e) { } }
    localDeletePlan(id);
    A.index.plans = A.index.plans.filter(x => x.id !== id); A.index.current = A.index.plans[0]?.id || null; A.plan = null; A.tx = [];
    if (A.index.current) await switchPlan(A.index.current); else { A.index.updatedAt = Date.now(); localSaveAll(); if (DB) DB.doc('meta/index').set(JSON.parse(JSON.stringify(A.index))).catch(() => { }); render(); }
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const f = ACT[el.dataset.a]; if (f) { f(el, e); }
});
// assigned inline inputs
function applyAssign(inp) {
  const cid = inp.dataset.assign; const cur = getAssigned(A.month, cid); let raw = inp.value.trim();
  if (raw === fmtIn(cur)) return;
  let v;
  if (/^[+*/]/.test(raw) || (/^-/.test(raw) && raw.length > 1 && cur !== 0)) { v = evalExpr(fmtIn(cur).replace(',', '.') + raw.replace(',', '.')); }
  else v = evalExpr(raw === '' ? '0' : raw);
  if (v == null) { inp.value = fmtIn(cur); toast('Montant non reconnu'); return; }
  render._keepScroll = true;
  mutate('Réparti : ' + catName(cid) + ' ' + fmt(v), () => setAssigned(A.month, cid, v), { silent: true });
}
document.addEventListener('focusin', e => { if (e.target.matches('.ass-in, .bigamt, [data-sp="amount"]')) setTimeout(() => e.target.select?.(), 0); });
document.addEventListener('keydown', e => {
  if (e.target.matches?.('.ass-in') && e.key === 'Enter') { e.preventDefault(); const all = $$('.ass-in'); const i = all.indexOf(e.target); const nextId = all[i + 1]?.dataset.assign; applyAssign(e.target); if (nextId) setTimeout(() => $(`[data-assign="${nextId}"]`)?.focus(), 0); return; }
  if (e.key === 'Escape' && $('#scrim')) { closeSheet(); return; }
  const typing = e.target.matches?.('input, textarea, select');
  if (!typing && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (typing || $('#scrim') || !A.plan) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); txSheet(null); }
  if (A.view === 'plan' && e.key === 'ArrowLeft') { A.month = addMonths(A.month, -1); render(); }
  if (A.view === 'plan' && e.key === 'ArrowRight') { A.month = addMonths(A.month, 1); render(); }
});
document.addEventListener('focusout', e => { if (e.target.matches?.('.ass-in') && document.body.contains(e.target)) applyAssign(e.target); });
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.d && D) {
    const k = el.dataset.d;
    if (k === 'amount') { const v = evalExpr(el.value); D.amount = v == null ? D.amount : Math.abs(v); return; }
    if (k === 'cleared') return;
    D[k] = el.value; return;
  }
  if (el.dataset.sp && D?.splits) { const s = D.splits[+el.dataset.i]; if (el.dataset.sp === 'amount') { const v = evalExpr(el.value); s.amount = v == null ? 0 : Math.abs(v); } else s[el.dataset.sp] = el.value; return; }
  if (el.dataset.i === 'search') { A.ui.search = el.value; clearTimeout(el._t); el._t = setTimeout(() => { const pos = el.selectionStart; render(); const n = $('#regSearch'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 220); return; }
  if (el.dataset.c === 'loanX') { loanSheet(el.dataset.id, +el.value); return; }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.d && D) {
    const k = el.dataset.d;
    if (k === 'cleared') { D.cleared = el.checked ? 'c' : 'u'; return; }
    if (k === 'amount') { updSplitStatus(); return; }
    D[k] = el.value;
    if (k === 'acct' && D.transferAcct === D.acct) D.transferAcct = '';
    if (k === 'payee') { if (!D.cat && !D.splits) { const y = L.payeeByName[el.value.trim().toLowerCase()]; if (y?.lastCat && L.cat[y.lastCat]) { D.cat = y.lastCat; const sel = $('#txCat'); if (sel) sel.value = y.lastCat; } } return; }
    if (['acct', 'transferAcct', 'date'].includes(k)) txRefresh();
    return;
  }
  if (el.dataset.sp && D?.splits) { if (el.dataset.sp === 'amount') updSplitStatus(); else D.splits[+el.dataset.i][el.dataset.sp] = el.value; return; }
  if (el.dataset.cf) { const c = L.cat[el.dataset.c]; const k = el.dataset.cf; const v = el.value; if (k === 'name' && !v.trim()) return; mutate('Enveloppe modifiée', () => { c[k] = k === 'name' ? v.trim() : v; }, { silent: true }); return; }
  if (el.dataset.tf) {
    const c = L.cat[el.dataset.c]; const k = el.dataset.tf;
    mutate('Objectif modifié', () => {
      if (k === 'type') { if (!el.value) c.target = null; else c.target = { ...(c.target || { amount: 0, mode: 'set' }), type: el.value }; return; }
      c.target ||= { type: 'monthly', amount: 0 };
      if (k === 'amount') c.target.amount = Math.abs(evalExpr(el.value) || 0);
      else if (['weekday', 'month', 'repeat'].includes(k)) c.target[k] = +el.value;
      else c.target[k] = el.value || null;
    }, { silent: true });
    catSheet(c.id); return;
  }
  if (el.dataset.mnote) { const m = el.dataset.mnote; mutate('Note du mois enregistrée', () => { (A.plan.notes ||= {})[m] = el.value; }, { silent: true }); return; }
  if (el.dataset.set) { const k = el.dataset.set; mutate('Réglage enregistré', () => { A.plan[k] = k === 'name' ? (el.value.trim() || A.plan.name) : el.value; }); _nfKey = ''; return; }
  if (el.dataset.py) {
    const y = L.payee[el.dataset.id]; const k = el.dataset.py;
    if (k === 'name') {
      const n = el.value.trim(); if (!n) return; const other = L.payeeByName[n.toLowerCase()];
      if (other && other.id !== y.id) { mutate('Bénéficiaires fusionnés', () => { A.tx.forEach(t => { if (t.payee === y.id) t.payee = other.id; }); A.plan.payees = A.plan.payees.filter(p => p.id !== y.id); }); payeesSheet(); }
      else mutate('Bénéficiaire renommé', () => { y.name = n; }, { silent: true });
    } else mutate('Catégorie par défaut enregistrée', () => { y.lastCat = el.value || null; }, { silent: true });
    return;
  }
  if (el.dataset.mp && IMP) { IMP.map[el.dataset.mp] = el.type === 'checkbox' ? el.checked : (el.dataset.mp === 'dfmt' ? el.value : +el.value); return; }
  if (el.dataset.c === 'impFile' && el.files[0]) { onImportFile(el.files[0]); return; }
  if (el.dataset.c === 'restore' && el.files[0]) { restoreFile(el.files[0]); el.value = ''; return; }
  if (el.dataset.c === 'selTx') { if (el.checked) A.ui.selected.add(el.dataset.id); else A.ui.selected.delete(el.dataset.id); $('#actionbar').innerHTML = A.ui.selected.size ? actionBar() : ''; return; }
});
$('#fab').addEventListener('click', () => txSheet(null));

/* ---------- boot ---------- */
(function boot() {
  try { const u = JSON.parse(localStorage.getItem('pecule.ui') || '{}'); if (u.collapsed) A.ui.collapsed = u.collapsed; } catch (e) { }
  const all = localLoad();
  if (all?.index?.plans?.length) {
    A.index = all.index; const cur = all.plans?.[A.index.current] || all.plans?.[A.index.plans[0].id];
    if (cur) { A.plan = cur.plan; A.tx = cur.tx; A.index.current = cur.plan.id; }
  }
  rebuildLookups();
  if (A.plan) { const n = runScheduled(); if (n) localSaveAll(); }
  render();
  initDb();
})();
</script>
